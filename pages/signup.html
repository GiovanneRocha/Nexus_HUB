<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexusHUB - Sign Up</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages.css" />
    <script src="../assets/js/pages.js"></script>
  </head>
  <body>
    <div class="login-container">
      <header>
        <h1>Criar Conta</h1>
        <p>Crie sua conta!</p>
      </header>

      <form id="signupForm">
        <div class="input-group">
          <i class="bi bi-person"></i>
          <input type="text" placeholder="Nome Completo" required />
        </div>

        <div class="input-group">
          <i class="bi bi-envelope"></i>
          <input type="email" placeholder="E-mail" required />
        </div>

        <div class="input-group">
          <i class="bi bi-key"></i>
          <input type="password" id="pass" placeholder="Senha" required />
        </div>

        <div class="input-group">
          <i class="bi bi-key"></i>
          <input
            type="password"
            id="confirmPass"
            placeholder="Confirmar Senha"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>

      <div class="signup-section">
        Já tem uma conta? <a href="../index.html">Faça Login</a>
      </div>
    </div>

    <script>
      document.getElementById("signupForm").addEventListener("submit", (e) => {
        e.preventDefault()
        const p1 = document.getElementById("pass").value
        const p2 = document.getElementById("confirmPass").value

        if (p1 !== p2) {
          alert("As senhas não conferem!")
        } else {
          alert("Conta criada com sucesso!")
          window.location.href = "../index.html"
        }
      })
    </script>
  </body>
</html>
