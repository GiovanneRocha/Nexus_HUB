<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Serviços - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .abas-gestao {
            display: flex;
            gap: 12px;
            margin: 28px 0 20px;
            flex-wrap: wrap;
        }

        .botao-aba {
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--surface);
            color: var(--texto-principal);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .botao-aba:hover {
            background: var(--surface-strong);
        }

        .botao-aba-ativo {
            background: var(--destaque);
            color: #ffffff;
            border-color: var(--destaque);
        }

        .tela-oculta {
            display: none;
        }

        #filtro-servicos {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dfe4f0;
            border-radius: 999px;
            background: var(--surface);
            color: var(--texto-principal);
            font-size: 0.95rem;
        }

        .notificacao-sucesso {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            z-index: 10000;
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0);     opacity: 1; }
            to   { transform: translateX(400px); opacity: 0; }
        }

        .fundo-lista {
            background: #f0f4f8;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 18px 45px rgba(15,18,33,0.06);
        }

        body.light-mode .fundo-lista {
            background: #f8fafb;
        }

        .tabela-lista-container {
            overflow-x: auto;
        }

        .tabela-lista-container table {
            min-width: 700px;
        }

        .badge-categoria {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }
    </style>

    <script src="../assets/js/common.js"></script>
</head>

<body class="corpo-dashboard">
    <div class="layout-erp">

        <main class="conteudo-principal">

            <section class="titulo-pagina-stack">
                <h1><i class="bi bi-tools"></i> Gestão de Serviços</h1>
                <p>Cadastre e gerencie os tipos de serviços utilizados nas Ordens de Serviço.</p>
            </section>

            <!-- ABAS -->
            <div class="abas-gestao">
                <button type="button" id="btn-cadastro" class="botao-aba botao-aba-ativo">
                    <i class="bi bi-plus-circle"></i> Cadastro
                </button>
                <button type="button" id="btn-lista" class="botao-aba">
                    <i class="bi bi-list-ul"></i> Serviços Cadastrados
                </button>
            </div>

            <div class="container-formulario-novo-atendimento">

                <!-- ======================== TELA CADASTRO ======================== -->
                <div id="view-cadastro">
                    <form id="formCadastroServico">
                        <div class="secao-formulario-novo">

                            <h3 id="titulo-form-servico"><i class="bi bi-plus-lg"></i> Novo Serviço</h3>

                            <div class="linha-campos">
                                <div class="bloco-campo-novo">
                                    <label><i class="bi bi-briefcase"></i> Nome do Serviço</label>
                                    <input type="text" id="nome-servico" placeholder="Ex: Manutenção de Motor" required>
                                </div>
                                <div class="bloco-campo-novo">
                                    <label><i class="bi bi-currency-dollar"></i> Valor Padrão (R$)</label>
                                    <input type="number" id="valor-servico" step="0.01" min="0" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="bloco-campo-novo">
                                <label><i class="bi bi-chat-left-text"></i> Descrição Padrão</label>
                                <textarea id="desc-servico" rows="3" placeholder="Breve descrição técnica do serviço..."></textarea>
                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 20px;">
                                <button type="submit" class="botao-acao">
                                    <i class="bi bi-save"></i> Salvar Serviço
                                </button>
                                <button type="button" class="botao-secundario" onclick="resetarFormulario()"
                                    style="padding: 12px 20px; border-radius: 8px; border: 1px solid #d1d5db; background: transparent; cursor: pointer;">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                            </div>

                        </div>
                    </form>
                </div>

                <!-- ======================== TELA LISTA ======================== -->
                <div id="view-lista" class="tela-oculta">
                    <div class="secao-formulario-novo">
                        <h3><i class="bi bi-list-ul"></i> Serviços Cadastrados</h3>

                        <div class="linha-campos" style="grid-template-columns: 1fr; margin-bottom: 20px;">
                            <div class="bloco-campo-novo">
                                <label>Pesquise pelo nome ou categoria do serviço</label>
                                <input type="text" id="filtro-servicos" placeholder="Digite para filtrar...">
                            </div>
                        </div>

                        <div class="fundo-lista tabela-lista-container">
                            <div id="lista-servicos-cadastrados"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const formServico = document.getElementById('formCadastroServico');
        let telaAtual = 'cadastro';
        let servicoEmEdicao = null;

        function mostrarNotificacao(mensagem) {
            const notif = document.createElement('div');
            notif.className = 'notificacao-sucesso';
            notif.innerHTML = `<i class="bi bi-check-circle"></i> ${mensagem}`;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function mostrarTela(tela) {
            telaAtual = tela;
            document.getElementById('view-cadastro').classList.toggle('tela-oculta', tela !== 'cadastro');
            document.getElementById('view-lista').classList.toggle('tela-oculta', tela !== 'lista');
            document.getElementById('btn-cadastro').classList.toggle('botao-aba-ativo', tela === 'cadastro');
            document.getElementById('btn-lista').classList.toggle('botao-aba-ativo', tela === 'lista');
            renderizarServicos();
        }

        function renderizarServicos() {
            const servicos = JSON.parse(localStorage.getItem('nexus_servicos_custom')) || [];
            const container = document.getElementById('lista-servicos-cadastrados');
            if (!container) return;

            if (telaAtual !== 'lista') {
                container.innerHTML = '';
                return;
            }

            const query = document.getElementById('filtro-servicos')?.value.trim().toLowerCase() || '';

            const filtrados = servicos
                .map((s, index) => ({ ...s, originalIndex: index }))
                .filter(s => {
                    const nome = String(s.nome || '').toLowerCase();
                    const cat  = String(s.categoria || '').toLowerCase();
                    return nome.includes(query) || cat.includes(query);
                })
                .sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR', { sensitivity: 'base' }));

            if (filtrados.length === 0) {
                container.innerHTML = `<p style="color: var(--texto-secundario); margin: 0;">Nenhum serviço encontrado.</p>`;
                return;
            }

            container.innerHTML = `
                <table class="tabela-custom" style="width: 100%; color: #000000;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 1px solid var(--bordar);">
                            <th>Nome</th>
                            <th>Valor Padrão</th>
                            <th>Descrição</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtrados.map(s => `
                            <tr>
                                <td><strong>${s.nome}</strong></td>
                                <td>R$ ${parseFloat(s.valor || 0).toFixed(2)}</td>
                                <td style="max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${s.desc || ''}">${s.desc || '-'}</td>
                                <td style="display: flex; gap: 8px;">
                                    <button onclick="editarServico(${s.originalIndex})" class="botao-acao"
                                        style="padding: 5px 10px; background: #3b82f6; color: white;">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button onclick="removerServico(${s.originalIndex})" class="botao-cancelar"
                                        style="padding: 5px 10px;">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        formServico.addEventListener('submit', e => {
            e.preventDefault();

            const valor = parseFloat(document.getElementById('valor-servico').value);
            if (valor < 0) { alert('Valor inválido.'); return; }

            const dados = {
                nome:  document.getElementById('nome-servico').value,
                valor: valor,
                desc:  document.getElementById('desc-servico').value
            };

            const servicos = JSON.parse(localStorage.getItem('nexus_servicos_custom')) || [];

            if (servicoEmEdicao !== null) {
                servicos[servicoEmEdicao] = { ...servicos[servicoEmEdicao], ...dados };
                mostrarNotificacao(`Serviço "${dados.nome}" atualizado com sucesso!`);
                servicoEmEdicao = null;
            } else {
                servicos.push({ id: Date.now(), ...dados, dataCadastro: new Date().toLocaleDateString('pt-BR') });
                registrarAtividade('servico_cadastrado', `Novo serviço cadastrado: ${dados.nome}`, `Valor: R$ ${valor.toFixed(2)}`);
                mostrarNotificacao(`Serviço "${dados.nome}" cadastrado com sucesso!`);
            }

            localStorage.setItem('nexus_servicos_custom', JSON.stringify(servicos));
            resetarFormulario();
        });

        function editarServico(index) {
            const servicos = JSON.parse(localStorage.getItem('nexus_servicos_custom')) || [];
            const s = servicos[index];

            document.getElementById('nome-servico').value      = s.nome      || '';

            document.getElementById('valor-servico').value     = s.valor     || 0;
            document.getElementById('desc-servico').value      = s.desc      || '';

            servicoEmEdicao = index;
            document.getElementById('titulo-form-servico').innerHTML = '<i class="bi bi-pencil"></i> Editar Serviço';
            mostrarTela('cadastro');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function removerServico(index) {
            if (confirm('Deseja excluir este serviço?')) {
                const servicos = JSON.parse(localStorage.getItem('nexus_servicos_custom')) || [];
                const nome = servicos[index].nome;
                servicos.splice(index, 1);
                localStorage.setItem('nexus_servicos_custom', JSON.stringify(servicos));
                mostrarNotificacao(`Serviço "${nome}" removido com sucesso!`);
                renderizarServicos();
            }
        }

        function resetarFormulario() {
            formServico.reset();
            servicoEmEdicao = null;
            document.getElementById('titulo-form-servico').innerHTML = '<i class="bi bi-plus-lg"></i> Novo Serviço';
        }

        document.getElementById('btn-cadastro').addEventListener('click', () => mostrarTela('cadastro'));
        document.getElementById('btn-lista').addEventListener('click', () => mostrarTela('lista'));
        document.getElementById('filtro-servicos')?.addEventListener('input', renderizarServicos);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('cadastro_servicos'));
            document.querySelector('.conteudo-principal').insertAdjacentHTML('afterbegin', getHeaderHTML());
            mostrarTela('cadastro');
        });
    </script>
</body>
</html>
