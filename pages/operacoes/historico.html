<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico e Editor Multipáginas - Nexus HUB</title>

    <link rel="icon" type="image/png" href="../../assets/images/icon-sistem.png">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/pages.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    </head>

<body class="corpo-dashboard">

    <div class="layout-erp">

        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">

            <!-- Header will be inserted here via JavaScript -->

            <section class="titulo-pagina-stack">

                <h1><i class="bi bi-clock-history"></i> Histórico de OS</h1>

                <p>Visualize e edite as páginas do relatório antes de exportar.</p>

            </section>

            <div class="card-tabela">

                <table class="tabela-dados">

                    <thead>

                        <tr>

                            <th>DATA</th>

                            <th>CLIENTE</th>

                            <th>FROTA</th>

                            <th>AÇÃO</th>

                        </tr>

                    </thead>

                    <tbody id="tabela-historico-corpo"></tbody>

                </table>

            </div>

        </main>

    </div>

    <div id="modalEditor" class="modal-editor">

        <div class="painel-editor">

            <div class="controles-superiores">

                <div>

                    <h3 style="margin: 0;">Editor de Relatório</h3>

                    <span style="font-size: 0.8rem; color: #2ecc71;">● Modo Visualização Ativo</span>

                </div>

                <div style="display: flex; gap: 10px;">

                    <button onclick="salvarEGerarPDF()" class="botao-acao" style="background: #2ecc71; padding: 10px 25px;"><i class="bi bi-download"></i> Baixar PDF Final</button>

                    <button onclick="fecharEditor()" class="botao-secundario" style="background: #444; color: white; border: none; padding: 10px 20px;"><i class="bi bi-x"></i> Sair</button>

                </div>

            </div>

            <div id="paginas-container">

                </div>

        </div>

    </div>

        <script src="../../assets/js/common.js"></script>

    <script src="../../assets/js/pages.js"></script>

    </body>

</html>
