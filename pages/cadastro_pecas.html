<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Peças - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/common.js"></script>
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">
            <!-- Header will be inserted here via JavaScript -->

            <section class="titulo-pagina">
                <h1><i class="bi bi-tools"></i> Gestão de Peças</h1>
                <p>Cadastre novas peças para serem utilizados nas Ordens de Serviço.</p>
            </section>

            <div class="container-formulario-novo-atendimento">
               Trabalhando...
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Insert sidebar with active page 'cadastro_pecas'
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('cadastro_pecas'));
            
            // Insert header
            document.querySelector('.conteudo-principal').insertAdjacentHTML('afterbegin', getHeaderHTML());
        });
    </script>
</body>
</html>
