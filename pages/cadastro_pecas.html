<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Peças - Nexus HUB</title>

    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">

    

    <script src="../assets/js/common.js"></script>

    <script src="../assets/js/pages.js"></script>

</head>

<body class="corpo-dashboard">

    <div class="layout-erp">

        <main class="conteudo-principal">

            <section class="titulo-pagina-stack">

                <h1><i class="bi bi-box-seam"></i> Gestão de Peças</h1>

                <p>Cadastre e gerencie as peças utilizadas nas Ordens de Serviço.</p>

            </section>

            <!-- ABAS -->

            <div class="abas-gestao">

                <button type="button" id="btn-cadastro" class="botao-aba botao-aba-ativo">

                    <i class="bi bi-plus-circle"></i> Cadastro

                </button>

                <button type="button" id="btn-estoque" class="botao-aba">

                    <i class="bi bi-box-seam"></i> Estoque

                </button>

            </div>

            <div class="container-formulario-novo-atendimento">

                <!-- ======================== TELA CADASTRO ======================== -->

                <div id="view-cadastro">

                    <form id="formCadastroPeca">

                        <div class="secao-formulario-novo">

                            <h3 id="titulo-form-peca"><i class="bi bi-plus-lg"></i> Nova Peça</h3>

                            <!-- LINHA 1: Nome + Categoria -->

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-box-seam"></i> Nome da Peça</label>

                                    <input type="text" id="nome-peca" placeholder="Ex: Pastilha de Freio" required>

                                </div>

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-grid"></i> Categoria</label>

                                    <select id="categoria-peca" required>

                                        <option value="">Selecione</option>

                                        <option value="Motor">Motor</option>

                                        <option value="Freios">Freios</option>

                                        <option value="Suspensão">Suspensão</option>

                                        <option value="Elétrica">Elétrica</option>

                                        <option value="Pneus">Pneus</option>

                                        <option value="Outros">Outros</option>

                                    </select>

                                </div>

                            </div>

                            <!-- LINHA 2: Marca + Fornecedor -->

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-award"></i> Marca / Fabricante</label>

                                    <input type="text" id="marca-peca" placeholder="Ex: Bosch" required>

                                </div>

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-truck"></i> Fornecedor</label>

                                    <input type="text" id="fornecedor-peca" placeholder="Ex: Auto Peças Brasil" required>

                                </div>

                            </div>

                            <!-- LINHA 3: Código + Estoque -->

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-card-text"></i> Código / Referência</label>

                                    <input type="text" id="codigo-peca" placeholder="Ex: PF-0012" required>

                                </div>

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-boxes"></i> Quantidade em Estoque</label>

                                    <input type="number" id="estoque-peca" min="0" placeholder="0" required>

                                </div>

                            </div>

                            <!-- LINHA 4: Unidade + Status -->

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-rulers"></i> Unidade</label>

                                    <select id="unidade-peca">

                                        <option value="Unidade">Unidade</option>

                                        <option value="Kit">Kit</option>

                                        <option value="Metro">Metro</option>

                                        <option value="Litro">Litro</option>

                                    </select>

                                </div>

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-check-circle"></i> Status</label>

                                    <select id="status-peca">

                                        <option value="Ativa">Ativa</option>

                                        <option value="Descontinuada">Descontinuada</option>

                                    </select>

                                </div>

                            </div>

                            <!-- LINHA 5: Valor (full width) -->

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-currency-dollar"></i> Valor Unitário (R$)</label>

                                    <input type="number" id="valor-peca" placeholder="0.00" step="0.01" min="0" required>

                                </div>

                            </div>

                            <!-- LINHA 7 -->

                            <div class="bloco-campo-novo">

                                <label><i class="bi bi-image"></i> Imagem da Peça</label>

                                <input type="file" id="imagem-peca-file" accept="image/*" onchange="carregarImagemPeca(this)"

                                    style="padding: 10px; border: 1px dashed #d1d5db; border-radius: 8px; cursor: pointer; width: 100%; background: var(--surface);">

                                <input type="hidden" id="imagem-peca">

                                <div id="preview-imagem-peca" style="margin-top: 10px; display: none;">

                                    <img id="img-preview" src="" alt="Preview"

                                        style="max-height: 120px; border-radius: 8px; border: 1px solid #eee; object-fit: contain;">

                                    <button type="button" onclick="removerImagemPeca()"

                                        style="display: block; margin-top: 6px; background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.8rem;">

                                        <i class="bi bi-x-circle"></i> Remover imagem

                                    </button>

                                </div>

                            </div>

                            <!-- DESCRIÇÃO -->

                            <div class="bloco-campo-novo">

                                <label><i class="bi bi-chat-left-text"></i> Descrição</label>

                                <textarea id="desc-peca" rows="2" placeholder="Descrição ou observações da peça..."></textarea>

                            </div>

                            <!-- BOTÕES -->

                            <div style="display: flex; gap: 12px; margin-top: 20px;">

                                <button type="submit" class="botao-acao">

                                    <i class="bi bi-save"></i> Salvar Peça

                                </button>

                                <button type="button" class="botao-secundario" onclick="resetarFormulario()"

                                    style="padding: 12px 20px; border-radius: 8px; border: 1px solid #d1d5db; background: transparent; cursor: pointer;">

                                    <i class="bi bi-x-circle"></i> Cancelar

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

                <!-- ======================== TELA ESTOQUE ======================== -->

                <div id="view-estoque" class="tela-oculta">

                    <div class="secao-formulario-novo">

                        <h3><i class="bi bi-box-seam"></i> Estoque de Peças</h3>

                        <div class="linha-campos" style="grid-template-columns: 1fr; margin-bottom: 20px;">

                            <div class="bloco-campo-novo">

                                <label>Pesquisa feita com o Nome ou Código da peça</label>

                                <input type="text" id="filtro-estoque" placeholder="Digite nome ou código para filtrar">

                            </div>

                        </div>

                        <div class="fundo-estoque tabela-estoque-container">

                            <div id="lista-pecas-cadastradas"></div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    

    </body>

</html>
