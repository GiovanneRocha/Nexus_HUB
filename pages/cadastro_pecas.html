```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Peças - Nexus HUB</title>

    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">

    <script src="../assets/js/common.js"></script>
</head>

<body class="corpo-dashboard">
    <div class="layout-erp">

        <main class="conteudo-principal">

            <section class="titulo-pagina">
                <h1><i class="bi bi-tools"></i> Gestão de Peças</h1>
                <p>Cadastre novas peças para serem utilizadas nas Ordens de Serviço.</p>
            </section>

            <div class="container-formulario-novo-atendimento">

                <!-- FORMULÁRIO -->
                <form id="formCadastroPeca">

                    <div class="secao-formulario-novo">

                        <h3><i class="bi bi-plus-lg"></i> Nova Peça</h3>

                        <!-- LINHA 1 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-box-seam"></i>
                                    Nome da Peça
                                </label>

                                <input
                                    type="text"
                                    id="nome-peca"
                                    placeholder="Ex: Pastilha de Freio"
                                    required
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-grid"></i>
                                    Categoria
                                </label>

                                <select id="categoria-peca" required>
                                    <option value="">Selecione</option>
                                    <option value="Motor">Motor</option>
                                    <option value="Freios">Freios</option>
                                    <option value="Suspensão">Suspensão</option>
                                    <option value="Elétrica">Elétrica</option>
                                    <option value="Pneus">Pneus</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>

                        </div>

                        <!-- LINHA 2 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-award"></i>
                                    Marca / Fabricante
                                </label>

                                <input
                                    type="text"
                                    id="marca-peca"
                                    placeholder="Ex: Bosch"
                                    required
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-truck"></i>
                                    Fornecedor
                                </label>

                                <input
                                    type="text"
                                    id="fornecedor-peca"
                                    placeholder="Ex: Auto Peças Brasil"
                                    required
                                >
                            </div>

                        </div>

                        <!-- LINHA 3 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-card-text"></i>
                                    Código / Referência
                                </label>

                                <input
                                    type="text"
                                    id="codigo-peca"
                                    placeholder="Ex: PF-0012"
                                    required
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-car-front"></i>
                                    Compatibilidade
                                </label>

                                <input
                                    type="text"
                                    id="compatibilidade-peca"
                                    placeholder="Ex: Honda Civic 2018-2022"
                                >
                            </div>

                        </div>

                        <!-- LINHA 4 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-boxes"></i>
                                    Quantidade em Estoque
                                </label>

                                <input
                                    type="number"
                                    id="estoque-peca"
                                    min="0"
                                    placeholder="0"
                                    required
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-exclamation-triangle"></i>
                                    Estoque Mínimo
                                </label>

                                <input
                                    type="number"
                                    id="estoque-minimo-peca"
                                    min="0"
                                    placeholder="0"
                                >
                            </div>

                        </div>

                        <!-- LINHA 5 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-geo-alt"></i>
                                    Localização no Estoque
                                </label>

                                <input
                                    type="text"
                                    id="localizacao-peca"
                                    placeholder="Ex: Prateleira A3"
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-rulers"></i>
                                    Unidade
                                </label>

                                <select id="unidade-peca">
                                    <option value="Unidade">Unidade</option>
                                    <option value="Kit">Kit</option>
                                    <option value="Metro">Metro</option>
                                    <option value="Litro">Litro</option>
                                </select>
                            </div>

                        </div>

                        <!-- LINHA 6 -->
                        <div class="linha-campos">

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-currency-dollar"></i>
                                    Valor Unitário (R$)
                                </label>

                                <input
                                    type="number"
                                    id="valor-peca"
                                    placeholder="0.00"
                                    step="0.01"
                                    min="0"
                                    required
                                >
                            </div>

                            <div class="bloco-campo-novo">
                                <label>
                                    <i class="bi bi-check-circle"></i>
                                    Status
                                </label>

                                <select id="status-peca">
                                    <option value="Ativa">Ativa</option>
                                    <option value="Em falta">Em falta</option>
                                    <option value="Descontinuada">Descontinuada</option>
                                </select>
                            </div>

                        </div>

                        <!-- LINHA 7 -->
                        <div class="bloco-campo-novo">

                            <label>
                                <i class="bi bi-image"></i>
                                URL da Imagem
                            </label>

                            <input
                                type="text"
                                id="imagem-peca"
                                placeholder="https://..."
                            >

                        </div>

                        <!-- DESCRIÇÃO -->
                        <div class="bloco-campo-novo">

                            <label>
                                <i class="bi bi-chat-left-text"></i>
                                Descrição
                            </label>

                            <textarea
                                id="desc-peca"
                                rows="2"
                                placeholder="Descrição ou observações da peça..."
                            ></textarea>

                        </div>

                        <!-- BOTÃO -->
                        <button
                            type="submit"
                            class="botao-acao"
                            style="margin-top: 20px;"
                        >
                            <i class="bi bi-save"></i>
                            Salvar Peça
                        </button>

                    </div>

                </form>

                <!-- LISTA -->
                <div class="secao-formulario-novo">

                    <h3>
                        <i class="bi bi-list-ul"></i>
                        Peças Cadastradas
                    </h3>

                    <div id="lista-pecas-cadastradas"></div>

                </div>

            </div>

        </main>

    </div>

    <script>

        const formPeca = document.getElementById('formCadastroPeca');

        function renderizarPecas() {

            const pecas =
                JSON.parse(localStorage.getItem('nexus_pecas')) || [];

            const container =
                document.getElementById('lista-pecas-cadastradas');

            if (pecas.length === 0) {

                container.innerHTML = `
                    <p style="color: var(--texto-secundario);">
                        Nenhuma peça cadastrada.
                    </p>
                `;

                return;
            }

            container.innerHTML = `
                <table
                    class="tabela-custom"
                    style="width: 100%; color: var(--texto-principal);"
                >

                    <thead>

                        <tr
                            style="
                                text-align: left;
                                border-bottom: 1px solid var(--bordar);
                            "
                        >
                            <th>Peça</th>
                            <th>Categoria</th>
                            <th>Marca</th>
                            <th>Fornecedor</th>
                            <th>Código</th>
                            <th>Estoque</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${pecas.map((p, index) => `

                            <tr>

                                <td>${p.nome}</td>

                                <td>${p.categoria}</td>

                                <td>${p.marca}</td>

                                <td>${p.fornecedor}</td>

                                <td>${p.codigo}</td>

                                <td>${p.estoque}</td>

                                <td>
                                    R$ ${parseFloat(p.valor).toFixed(2)}
                                </td>

                                <td>${p.status}</td>

                                <td>

                                    <button
                                        onclick="removerPeca(${index})"
                                        class="botao-cancelar"
                                        style="padding: 5px 10px;"
                                    >
                                        <i class="bi bi-trash"></i>
                                    </button>

                                </td>

                            </tr>

                        `).join('')}

                    </tbody>

                </table>
            `;
        }

        formPeca.addEventListener('submit', (e) => {

            e.preventDefault();

            const valor =
                parseFloat(document.getElementById('valor-peca').value);

            const estoque =
                parseInt(document.getElementById('estoque-peca').value);

            if (valor < 0 || estoque < 0) {

                alert('Valores inválidos.');

                return;
            }

            const novaPeca = {

                id: Date.now(),

                nome:
                    document.getElementById('nome-peca').value,

                categoria:
                    document.getElementById('categoria-peca').value,

                marca:
                    document.getElementById('marca-peca').value,

                fornecedor:
                    document.getElementById('fornecedor-peca').value,

                codigo:
                    document.getElementById('codigo-peca').value,

                compatibilidade:
                    document.getElementById('compatibilidade-peca').value,

                estoque:
                    estoque,

                estoqueMinimo:
                    parseInt(
                        document.getElementById('estoque-minimo-peca').value
                    ) || 0,

                localizacao:
                    document.getElementById('localizacao-peca').value,

                unidade:
                    document.getElementById('unidade-peca').value,

                valor:
                    valor,

                status:
                    document.getElementById('status-peca').value,

                imagem:
                    document.getElementById('imagem-peca').value,

                desc:
                    document.getElementById('desc-peca').value,

                dataCadastro:
                    new Date().toLocaleDateString('pt-BR')

            };

            const pecas =
                JSON.parse(localStorage.getItem('nexus_pecas')) || [];

            pecas.push(novaPeca);

            localStorage.setItem(
                'nexus_pecas',
                JSON.stringify(pecas)
            );

            formPeca.reset();

            renderizarPecas();

        });

        function removerPeca(index) {

            if (confirm('Deseja excluir esta peça?')) {

                const pecas =
                    JSON.parse(localStorage.getItem('nexus_pecas')) || [];

                pecas.splice(index, 1);

                localStorage.setItem(
                    'nexus_pecas',
                    JSON.stringify(pecas)
                );

                renderizarPecas();
            }
        }

        window.onload = renderizarPecas;

    </script>

    <script>

        document.addEventListener('DOMContentLoaded', function() {

            document
                .querySelector('.layout-erp')
                .insertAdjacentHTML(
                    'afterbegin',
                    getSidebarHTML('cadastro_pecas')
                );

            document
                .querySelector('.conteudo-principal')
                .insertAdjacentHTML(
                    'afterbegin',
                    getHeaderHTML()
                );
        });

    </script>

</body>
</html>
```
