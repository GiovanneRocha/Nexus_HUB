<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus HUB - Criar Conta</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .container-principal {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .secao-apresentacao {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: var(--gradiente-esquerda);
        }

        .conteudo-apresentacao {
            max-width: 520px;
        }

        .logotipo {
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .subtitulo-topo {
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--verde-esmeralda);
            margin-bottom: 16px;
            font-weight: 600;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--branco);
        }

        h1 span {
            color: var(--verde-esmeralda);
        }

        .descricao-texto {
            color: var(--texto-secundario);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .citacao-rodape {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--texto-suave);
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 40px;
        }

        .secao-formulario {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--gradiente-direita);
        }

        .caixa-formulario {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--bordar);
            box-shadow: var(--sombra-lg);
        }

        .caixa-formulario h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitulo-formulario {
            color: var(--texto-secundario);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .tipo-usuario-info {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--verde-esmeralda);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: var(--texto-principal);
        }

        .bloco-campo {
            margin-bottom: 18px;
        }

        .bloco-campo label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--texto-principal);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .bloco-campo input,
        .bloco-campo select {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface-strong);
            border: 1px solid var(--bordar);
            border-radius: 8px;
            color: var(--texto-principal);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .bloco-campo input:focus,
        .bloco-campo select:focus {
            outline: none;
            border-color: var(--verde-esmeralda);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .bloco-campo input::placeholder {
            color: var(--texto-suave);
        }

        .campo-senha {
            position: relative;
        }

        .botao-mostrar-senha {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            color: var(--texto-secundario);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .botao-mostrar-senha:hover {
            color: var(--verde-esmeralda);
        }

        .alinhamento-etiqueta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .botao-acao {
            width: 100%;
            padding: 14px 24px;
            background: var(--verde-esmeralda);
            color: var(--azul-escuro);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .botao-acao:hover {
            background: var(--verde-escuro);
            transform: translateY(-2px);
            box-shadow: var(--sombra-md);
        }

        .botao-acao:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .area-novo-cadastro {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--texto-secundario);
            border-top: 1px solid var(--bordar);
            padding-top: 20px;
        }

        .area-novo-cadastro a {
            color: var(--destaque);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .area-novo-cadastro a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .alerta {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alerta.erro {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--erro);
            color: var(--erro);
        }

        .alerta.sucesso {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--verde-esmeralda);
            color: var(--verde-esmeralda);
        }

        @media (max-width: 768px) {
            .container-principal {
                flex-direction: column;
            }

            .secao-apresentacao {
                flex: auto;
                padding: 40px 24px;
            }

            .secao-formulario {
                flex: auto;
                padding: 24px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-principal">
        <div class="secao-apresentacao">
            <div class="conteudo-apresentacao">
                <div class="logotipo"><img src="../assets/images/icon-sistem.png" alt="Nexus HUB" class="logo-icon"> Nexus HUB</div>
                <p class="subtitulo-topo">Cadastro de Usuário</p>
                <h1>Preencha seus <span>Dados</span></h1>
                <p class="descricao-texto">Forneça as informações necessárias para criar sua conta e comece a usar o sistema Nexus HUB.</p>
                <div class="citacao-rodape">
                    <i class="bi bi-quote"></i> Seus dados estão seguros conosco.
                </div>
            </div>
        </div>

        <div class="secao-formulario">
            <div class="caixa-formulario">
                <h2><i class="bi bi-person-check"></i> Dados Pessoais</h2>
                <p class="subtitulo-formulario">Complete seu cadastro no sistema.</p>
                
                <div class="tipo-usuario-info" id="tipoUsuarioInfo"></div>

                <div id="mensagemAlerta"></div>

                <form id="formCadastro">
                    <div class="bloco-campo">
                        <label for="nome"><i class="bi bi-person"></i> Nome Completo</label>
                        <input type="text" id="nome" placeholder="João Silva Santos" required>
                    </div>
                    
                    <div class="bloco-campo">
                        <label for="email"><i class="bi bi-envelope"></i> E-mail Corporativo</label>
                        <input type="email" id="email" placeholder="nome@empresa.com.br" required>
                    </div>

                    <div class="bloco-campo">
                        <label for="telefone"><i class="bi bi-telephone"></i> Telefone (Opcional)</label>
                        <input type="tel" id="telefone" placeholder="(11) 98765-4321">
                    </div>

                    <div class="bloco-campo campo-senha">
                        <label for="senha"><i class="bi bi-key"></i> Senha de Acesso</label>
                        <input type="password" id="senha" placeholder="••••••••" required>
                        <button type="button" class="botao-mostrar-senha" id="btnMostrarSenha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <div class="bloco-campo campo-senha">
                        <label for="confirmarSenha"><i class="bi bi-key"></i> Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" placeholder="••••••••" required>
                        <button type="button" class="botao-mostrar-senha" id="btnMostrarSenhaConfirm">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="botao-acao"><i class="bi bi-check-circle"></i> Criar Conta</button>
                </form>

                <div class="area-novo-cadastro">
                    Já tem uma conta? <a href="../index.html">Faça Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obter tipo de usuário da sessionStorage
        const tipoUsuario = sessionStorage.getItem('tipoUsuario');
        const tipoUsuarioInfo = document.getElementById('tipoUsuarioInfo');
        const botaoMostrarSenha = document.getElementById('btnMostrarSenha');
        const botaoMostrarSenhaConfirm = document.getElementById('btnMostrarSenhaConfirm');
        const inputSenha = document.getElementById('senha');
        const inputConfirmarSenha = document.getElementById('confirmarSenha');
        const formCadastro = document.getElementById('formCadastro');
        const mensagemAlerta = document.getElementById('mensagemAlerta');

        // Se não há tipo selecionado, redireciona para seleção de tipo
        if (!tipoUsuario) {
            window.location.href = 'cadastro_tipo.html';
        }

        // Mostrar tipo de usuário
        const tipoNome = tipoUsuario === 'admin' ? 'Administrador' : 'Técnico';
        const tipoIcone = tipoUsuario === 'admin' ? 'bi-shield-lock' : 'bi-tools';
        tipoUsuarioInfo.innerHTML = `<i class="bi ${tipoIcone}"></i> <strong>Tipo de Acesso:</strong> ${tipoNome}`;

        // Toggle mostrar/esconder senha
        botaoMostrarSenha.addEventListener('click', function(e) {
            e.preventDefault();
            const tipo = inputSenha.type === 'password' ? 'text' : 'password';
            inputSenha.type = tipo;
            this.innerHTML = tipo === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });

        botaoMostrarSenhaConfirm.addEventListener('click', function(e) {
            e.preventDefault();
            const tipo = inputConfirmarSenha.type === 'password' ? 'text' : 'password';
            inputConfirmarSenha.type = tipo;
            this.innerHTML = tipo === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });

        // Validação e submit do formulário
        formCadastro.addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Limpar mensagem anterior
            mensagemAlerta.innerHTML = '';

            // Validações
            if (!nome || !email || !senha || !confirmarSenha) {
                mostrarAlerta('Todos os campos obrigatórios devem ser preenchidos.', 'erro');
                return;
            }

            if (senha.length < 6) {
                mostrarAlerta('A senha deve ter no mínimo 6 caracteres.', 'erro');
                return;
            }

            if (senha !== confirmarSenha) {
                mostrarAlerta('As senhas não conferem!', 'erro');
                return;
            }

            if (!validarEmail(email)) {
                mostrarAlerta('Por favor, insira um e-mail válido.', 'erro');
                return;
            }

            // Se tudo está válido
            mostrarAlerta('Conta criada com sucesso! Redirecionando para login...', 'sucesso');
            
            // Limpar sessionStorage
            sessionStorage.removeItem('tipoUsuario');

            // Redirecionar após 1.5 segundos
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 1500);
        });

        function mostrarAlerta(mensagem, tipo) {
            mensagemAlerta.innerHTML = `<div class="alerta ${tipo}"><i class="bi bi-${tipo === 'erro' ? 'exclamation-triangle' : 'check-circle'}"></i> ${mensagem}</div>`;
        }

        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
    </script>
</body>
</html>
