<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Serviços - Nexus HUB</title>

    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/pages.css">

    <script src="../assets/js/common.js"></script>

    <script src="../assets/js/pages.js"></script>

</head>

<body class="corpo-dashboard">

    <div class="layout-erp">

        <main class="conteudo-principal">

            <section class="titulo-pagina-stack">

                <h1><i class="bi bi-tools"></i> Gestão de Serviços</h1>

                <p>Cadastre e gerencie os tipos de serviços utilizados nas Ordens de Serviço.</p>

            </section>

            <!-- ABAS -->

            <div class="abas-gestao">

                <button type="button" id="btn-cadastro" class="botao-aba botao-aba-ativo">

                    <i class="bi bi-plus-circle"></i> Cadastro

                </button>

                <button type="button" id="btn-lista" class="botao-aba">

                    <i class="bi bi-list-ul"></i> Serviços Cadastrados

                </button>

            </div>

            <div class="container-formulario-novo-atendimento">

                <!-- ======================== TELA CADASTRO ======================== -->

                <div id="view-cadastro">

                    <form id="formCadastroServico">

                        <div class="secao-formulario-novo">

                            <h3 id="titulo-form-servico"><i class="bi bi-plus-lg"></i> Novo Serviço</h3>

                            <div class="linha-campos">

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-briefcase"></i> Nome do Serviço</label>

                                    <input type="text" id="nome-servico" placeholder="Ex: Manutenção de Motor" required>

                                </div>

                                <div class="bloco-campo-novo">

                                    <label><i class="bi bi-currency-dollar"></i> Valor Padrão (R$)</label>

                                    <input type="number" id="valor-servico" step="0.01" min="0" placeholder="0.00" required>

                                </div>

                            </div>

                            <div class="bloco-campo-novo">

                                <label><i class="bi bi-chat-left-text"></i> Descrição Padrão</label>

                                <textarea id="desc-servico" rows="3" placeholder="Breve descrição técnica do serviço..."></textarea>

                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 20px;">

                                <button type="submit" class="botao-acao">

                                    <i class="bi bi-save"></i> Salvar Serviço

                                </button>

                                <button type="button" class="botao-secundario" onclick="resetarFormulario()"

                                    style="padding: 12px 20px; border-radius: 8px; border: 1px solid #d1d5db; background: transparent; cursor: pointer;">

                                    <i class="bi bi-x-circle"></i> Cancelar

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

                <!-- ======================== TELA LISTA ======================== -->

                <div id="view-lista" class="tela-oculta">

                    <div class="secao-formulario-novo">

                        <h3><i class="bi bi-list-ul"></i> Serviços Cadastrados</h3>

                        <div class="linha-campos" style="grid-template-columns: 1fr; margin-bottom: 20px;">

                            <div class="bloco-campo-novo">

                                <label>Pesquise pelo nome ou categoria do serviço</label>

                                <input type="text" id="filtro-servicos" placeholder="Digite para filtrar...">

                            </div>

                        </div>

                        <div class="fundo-lista tabela-lista-container">

                            <div id="lista-servicos-cadastrados"></div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    </body>

</html>
