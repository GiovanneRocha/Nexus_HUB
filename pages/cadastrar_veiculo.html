<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo - Nexus HUB</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body.contraste-alto, body.contraste-alto * {
            background: #000 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        .skip-link {
            position: absolute;
            left: -999px;
            top: 10px;
            background: #222;
            color: #fff;
            padding: 8px 16px;
            z-index: 1000;
        }
        .skip-link:focus {
            left: 10px;
        }
        .log-historico {
            background: #f4f4f4;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
    <script src="../assets/js/log.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-principal">
    <a href="#main-content" class="skip-link" tabindex="1">Pular para o conteúdo principal</a>
    <button id="btn-contraste" style="position:fixed;top:10px;right:10px;z-index:1001;" aria-label="Ativar/desativar alto contraste" accesskey="c">Contraste</button>
    <div class="container" id="main-content" tabindex="0">
        <div class="secao-formulario">
            <div class="caixa-formulario">
                <h2><i class="bi bi-truck"></i> Cadastro de Veículo</h2>
                <form id="formVeiculo">
                    <div class="bloco-campo">
                        <label for="placa"><i class="bi bi-credit-card-2-front"></i> Placa</label>
                        <input type="text" id="placa" placeholder="ABC-1234" maxlength="8" required>
                    </div>
                    <div class="bloco-campo">
                        <label for="modelo"><i class="bi bi-car-front"></i> Modelo</label>
                        <input type="text" id="modelo" placeholder="Modelo do veículo" required>
                    </div>
                    <div class="bloco-campo">
                        <label for="ano"><i class="bi bi-calendar"></i> Ano</label>
                        <input type="number" id="ano" placeholder="2020" min="1900" max="2100" required>
                    </div>
                    <div class="bloco-campo">
                        <label for="cor"><i class="bi bi-palette"></i> Cor</label>
                        <input type="text" id="cor" placeholder="Cor do veículo" required>
                    </div>
                    <div class="bloco-campo">
                        <label for="cliente"><i class="bi bi-person"></i> Cliente Associado</label>
                        <select id="cliente" required>
                            <option value="">Selecione o cliente</option>
                        </select>
                    </div>
                    <button type="submit" class="botao-acao"><i class="bi bi-plus-circle"></i> Cadastrar Veículo</button>
                </form>
                <div id="mensagem" class="mensagem-sucesso" style="display:none;"></div>
                <hr>
                <h3>Veículos Cadastrados</h3>
                <input type="text" id="buscaVeiculo" placeholder="Buscar por placa, modelo ou cor..." style="width:100%;margin-bottom:10px;">
                <ul id="listaVeiculos" class="lista-veiculos"></ul>
            </div>
        </div>
    </div>
    <script>
    // Contraste e atalhos
    document.getElementById('btn-contraste').onclick = function() {
        document.body.classList.toggle('contraste-alto');
        localStorage.setItem('contrasteAtivo', document.body.classList.contains('contraste-alto'));
    };
    if(localStorage.getItem('contrasteAtivo') === 'true') {
        document.body.classList.add('contraste-alto');
    }
    document.addEventListener('keydown', function(e) {
        if (e.altKey && e.key.toLowerCase() === 'c') {
            document.getElementById('btn-contraste').click();
        }
        if (e.altKey && e.key.toLowerCase() === 's') {
            document.querySelector('.skip-link').focus();
        }
    });

    // Exemplo: salvar log ao cadastrar veículo
    document.getElementById('formVeiculo')?.addEventListener('submit', function(e) {
        const placa = document.getElementById('placa')?.value || '';
        salvarLog('veiculo', placa, 'Cadastro', 'Veículo cadastrado');
    });

    // Exibir histórico
    function mostrarHistorico() {
        const placa = document.getElementById('placa')?.value || '';
        const logs = obterLog('veiculo', placa);
        const div = document.getElementById('historico-log');
        if (!div) return;
        div.innerHTML = logs.length ? logs.map(l => `<div><b>${l.data}</b>: ${l.acao} - ${l.detalhes}</div>`).join('') : '<i>Nenhum histórico.</i>';
    }
    document.getElementById('placa')?.addEventListener('blur', mostrarHistorico);
    window.onload = mostrarHistorico;
                // Exibir lista de veículos cadastrados com filtro
                function exibirVeiculos(filtro = "") {
                    const lista = document.getElementById('listaVeiculos');
                    if (!lista) return;
                    lista.innerHTML = '';
                    const veiculos = JSON.parse(localStorage.getItem('veiculos')) || [];
                    const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
                    const filtroLower = filtro.trim().toLowerCase();
                    veiculos.filter(v => {
                        if (!filtroLower) return true;
                        return (
                            v.placa.toLowerCase().includes(filtroLower) ||
                            v.modelo.toLowerCase().includes(filtroLower) ||
                            v.cor.toLowerCase().includes(filtroLower)
                        );
                    }).forEach(veiculo => {
                        const cliente = clientes.find(c => c.id == veiculo.clienteId);
                        const li = document.createElement('li');
                        li.innerHTML = `<b>${veiculo.placa}</b> - ${veiculo.modelo} (${veiculo.ano}, ${veiculo.cor})<br><small>Cliente: ${cliente ? cliente.nome : 'Não encontrado'}</small>`;
                        lista.appendChild(li);
                    });
                }

                // Filtro de busca
                document.addEventListener('DOMContentLoaded', function() {
                    const busca = document.getElementById('buscaVeiculo');
                    if (busca) {
                        busca.addEventListener('input', function() {
                            exibirVeiculos(this.value);
                        });
                    }
                    exibirVeiculos();
                });
        // Carregar clientes do localStorage
        function carregarClientes() {
            const select = document.getElementById('cliente');
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            clientes.forEach(cliente => {
                const option = document.createElement('option');
                option.value = cliente.id;
                option.textContent = cliente.nome + ' (' + cliente.email + ')';
                select.appendChild(option);
            });
        }

        // Salvar veículo no localStorage

        function validarPlaca(placa) {
            // Padrão Mercosul: ABC-1234 ou ABC1D23
            return /^[A-Z]{3}-?\d{4}$/.test(placa) || /^[A-Z]{3}\d[A-Z]\d{2}$/.test(placa);
        }

        function mostrarMensagem(msg, tipo) {
            const el = document.getElementById('mensagem');
            el.textContent = msg;
            el.className = tipo === 'erro' ? 'mensagem-erro' : 'mensagem-sucesso';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3500);
        }

        document.getElementById('formVeiculo').addEventListener('submit', function(evento) {
            evento.preventDefault();
            const placaInput = document.getElementById('placa');
            const modeloInput = document.getElementById('modelo');
            const anoInput = document.getElementById('ano');
            const corInput = document.getElementById('cor');
            const clienteInput = document.getElementById('cliente');

            const placa = placaInput.value.trim().toUpperCase();
            const modelo = modeloInput.value.trim();
            const ano = anoInput.value;
            const cor = corInput.value.trim();
            const clienteId = clienteInput.value;

            // Reset estilos
            [placaInput, modeloInput, anoInput, corInput, clienteInput].forEach(i => i.classList.remove('erro-campo'));

            if (!placa || !modelo || !ano || !cor || !clienteId) {
                mostrarMensagem('Preencha todos os campos!', 'erro');
                [placaInput, modeloInput, anoInput, corInput, clienteInput].forEach(i => { if (!i.value) i.classList.add('erro-campo'); });
                return;
            }
            if (!validarPlaca(placa)) {
                mostrarMensagem('Placa inválida! Use o formato ABC-1234 ou ABC1D23.', 'erro');
                placaInput.classList.add('erro-campo');
                return;
            }
            const anoNum = parseInt(ano);
            const anoAtual = new Date().getFullYear();
            if (isNaN(anoNum) || anoNum < 1900 || anoNum > anoAtual + 1) {
                mostrarMensagem('Ano inválido!', 'erro');
                anoInput.classList.add('erro-campo');
                return;
            }

            const veiculo = {
                id: Date.now(),
                placa,
                modelo,
                ano,
                cor,
                clienteId
            };

            const veiculos = JSON.parse(localStorage.getItem('veiculos')) || [];
            veiculos.push(veiculo);
            localStorage.setItem('veiculos', JSON.stringify(veiculos));

            // Associar veículo ao cliente
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            const cliente = clientes.find(c => c.id == clienteId);
            if (cliente) {
                if (!cliente.veiculos) cliente.veiculos = [];
                cliente.veiculos.push(veiculo.id);
                localStorage.setItem('clientes', JSON.stringify(clientes));
            }

            mostrarMensagem('Veículo cadastrado com sucesso!', 'sucesso');
            document.getElementById('formVeiculo').reset();
            exibirVeiculos();
        });

        carregarClientes();

        // Exibir lista ao carregar
        exibirVeiculos();

        // Estilo para campos com erro
        const style = document.createElement('style');
        style.innerHTML = `
        .erro-campo { border: 2px solid #e74c3c !important; background: #fff0f0 !important; }
        .mensagem-erro { color: #fff; background: #e74c3c; padding: 8px; border-radius: 4px; margin-top: 10px; text-align: center; }
        .mensagem-sucesso { color: #fff; background: #10b981; padding: 8px; border-radius: 4px; margin-top: 10px; text-align: center; }
        .lista-veiculos { list-style: none; padding: 0; }
        .lista-veiculos li { background: #1f2937; color: #fff; margin-bottom: 6px; padding: 8px 12px; border-radius: 4px; font-size: 1rem; }
        @media (max-width: 600px) {
            .caixa-formulario, .secao-formulario { padding: 8px !important; }
            .lista-veiculos li { font-size: 0.95rem; padding: 6px 6px; }
        }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
