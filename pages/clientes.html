<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Nexus HUB</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <aside class="barra-lateral">
            <div class="topo-lateral">
                <div class="logo-erp">Nexus HUB</div>
                <div class="busca-global">
                    <input type="text" placeholder="Busca Global...">
                </div>
            </div>
            <nav class="menu-navegacao">
                <div class="perfil-status">
                    <div class="avatar-mini">OS</div>
                    <div>
                        <p class="nome-empresa">Sistema de OS</p>
                        <p class="tag-empresa">v1.0</p>
                    </div>
                </div>
                <ul>
                    <li><a href="menu.html" class="link-menu">📊 Dashboard</a></li>
                    <li><a href="novo_atendimento.html" class="link-menu">📝 Novo Atendimento</a></li>
                    <li class="item-ativo"><a href="clientes.html" class="link-menu">👥 Clientes</a></li>
                    <li><a href="revisao.html" class="link-menu">✅ Revisão de OS</a></li>
                    <li><a href="historico.html" class="link-menu">📋 Histórico</a></li>
                </ul>

                
            </nav>
        </aside>

        <main class="conteudo-principal">
            <header class="cabecalho-topo">
                <div class="alerta-notificacao">🔔</div>
                <div class="perfil-usuario">
                    <div class="info-usuario">
                        <p class="usuario-nome">Julian Vane</p>
                        <p class="usuario-cargo">Administrador</p>
                    </div>
                    <img src="../assets/images/manoel.jpeg" alt="Perfil" class="foto-perfil">
                </div>
            </header>

            <section class="titulo-pagina" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Gestão de Clientes</h1>
                    <p>Visualize e gerencie as empresas parceiras da AutoDiagnose.</p>
                </div>
                <button onclick="window.location.href='cadastrar_empresa.html'" class="botao-acao" style="width: auto; padding: 12px 25px; background: var(--azul-escuro); border-radius: 12px; color: white; border: none; cursor: pointer; font-weight: bold;">
                    ＋ Nova Empresa
                </button>
            </section>

            <div class="card-os" style="background: white; border-radius: 20px; padding: 0; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 20px; width: 100%;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f8f9fd; border-bottom: 2px solid #eee;">
                        <tr>
                            <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800;">EMPRESA</th>
                            <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800;">CNPJ</th>
                            <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800;">CONTATO PRINCIPAL</th>
                            <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800;">TELEFONE</th>
                            <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800;">E-MAIL</th> <th style="padding: 20px; font-size: 0.8rem; color: #777; font-weight: 800; text-align: center;">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes-corpo">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function renderizarClientes() {
            const empresas = JSON.parse(localStorage.getItem('nexus_empresas')) || [];
            const corpo = document.getElementById('tabela-clientes-corpo');
            
            if (empresas.length === 0) {
                corpo.innerHTML = `<tr><td colspan="6" style="padding: 40px; text-align: center; color: #999;">Nenhuma empresa cadastrada.</td></tr>`;
                return;
            }

            corpo.innerHTML = empresas.map(emp => {
                return `
                    <tr style="border-bottom: 1px solid #eee; transition: 0.3s;" onmouseover="this.style.background='#fbfcfe'" onmouseout="this.style.background='white'">
                        <td style="padding: 15px 20px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div style="width: 35px; height: 35px; border-radius: 8px; background: #f0f2f5; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🏢</div>
                                <strong style="color: var(--azul-escuro);">${emp.nome}</strong>
                            </div>
                        </td>
                        <td style="padding: 20px; font-size: 0.9rem; color: #555;">${emp.cnpj}</td>
                        <td style="padding: 20px; font-size: 0.9rem; color: #555;">${emp.contato || '---'}</td>
                        <td style="padding: 20px; font-size: 0.9rem; color: #555;">${emp.telefone}</td>
                        <td style="padding: 20px; font-size: 0.9rem; color: #555;">${emp.email || '---'}</td> <td style="padding: 20px; text-align: center;">
                            <button onclick="verPerfil(${emp.id})" style="background: #eef2ff; color: #4f46e5; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem;">
                                Visualizar Perfil
                            </button>
                        </td>
                    </tr>
                `;  
            }).join('');
        }

        function verPerfil(id) {
            localStorage.setItem('empresa_selecionada', id);
            window.location.href = 'perfil_empresa.html';
        }

        window.onload = renderizarClientes;
    </script>
</body>
</html>
