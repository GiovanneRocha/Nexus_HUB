<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/common.js"></script>
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">
            <!-- Header will be inserted here via JavaScript -->

            <section class="sessao-metricas">
                <div class="titulo-pagina">
                    <h1><i class="bi bi-speedometer2"></i> Painel de Controle</h1>
                    <p>Acompanhe as métricas e informações do sistema em tempo real.</p>
                </div>

                <div class="grade-cards">
                    <div class="card-metrica">
                        <p class="rotulo-metrica"><i class="bi bi-exclamation-circle"></i> OS Abertas</p>
                        <h3 id="os-abertas">18</h3>
                        <span class="tendencia">Aguardando</span>
                    </div>
                    <div class="card-metrica">
                        <p class="rotulo-metrica"><i class="bi bi-hourglass-split"></i> Em Análise</p>
                        <h3 id="os-analise">7</h3>
                        <span class="tendencia">Processando</span>
                    </div>
                    <div class="card-metrica destaque-escuro">
                        <p class="rotulo-metrica"><i class="bi bi-check-circle"></i> Finalizadas (Mês)</p>
                        <h3 id="os-finalizadas">42</h3>
                        <span class="tendencia">Concluídas</span>
                    </div>
                    <div class="card-metrica">
                        <p class="rotulo-metrica"><i class="bi bi-people"></i> Total Clientes</p>
                        <h3 id="total-clientes">156</h3>
                        <span class="tendencia positiva"><i class="bi bi-arrow-up"></i> +8</span>
                    </div>
                </div>

                <div class="area-graficos">
                    <div class="card-grafico-principal">
                        <h4><i class="bi bi-bar-chart"></i> Atendimentos por Mês</h4>
                        <div class="simulador-grafico">
                            <div class="barra" style="height: 40%;"></div>
                            <div class="barra" style="height: 60%;"></div>
                            <div class="barra" style="height: 45%;"></div>
                            <div class="barra destaque" style="height: 80%;"></div>
                            <div class="barra" style="height: 55%;"></div>
                            <div class="barra" style="height: 70%;"></div>
                        </div>
                    </div>
                    <div class="card-atividade">
                        <h4><i class="bi bi-list-ul"></i> Atividades</h4>
                        <ul id="lista-atividades" class="lista-atividades">
                            <li class="atividade-item">Carregando atividades...</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function alternarMenu() {
            const menu = document.getElementById('menuSuspenso');
            menu.classList.toggle('visivel');
        }

        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('nexus-theme', isLight ? 'light' : 'dark');
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const button = document.getElementById('themeToggleButton');
            if (!button) return;
            if (document.documentElement.classList.contains('light-mode')) {
                button.innerHTML = '<i class="bi bi-moon-fill"></i> Modo Escuro';
            } else {
                button.innerHTML = '<i class="bi bi-sun-fill"></i> Modo Claro';
            }
        }

        function initTheme() {
            if (localStorage.getItem('nexus-theme') === 'light') {
                document.documentElement.classList.add('light-mode');
            } else {
                document.documentElement.classList.remove('light-mode');
            }
            updateThemeButtonText();
        }

        window.addEventListener('DOMContentLoaded', initTheme);

        window.onclick = function(event) {
            if (!event.target.matches('.botao-menu-trigger') && !event.target.closest('.botao-menu-trigger')) {
                const menus = document.getElementsByClassName("menu-suspenso");
                for (let i = 0; i < menus.length; i++) {
                    if (menus[i].classList.contains('visivel')) {
                        menus[i].classList.remove('visivel');
                    }
                }
            }
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Insert sidebar with active page 'menu'
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('menu'));
            
            // Insert header
            document.querySelector('.conteudo-principal').insertAdjacentHTML('afterbegin', getHeaderHTML());

            // Load metrics on page load
            loadMetrics();

            // Update metrics every 30 seconds
            setInterval(loadMetrics, 30000);
        });

        async function loadMetrics() {
            try {
                // Load data from localStorage and compute metrics
                const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
                const empresas = JSON.parse(localStorage.getItem('nexus_empresas')) || [];

                // Compute metrics
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();

                const os_abertas = atendimentos.filter(a => a.status === 'pendente_revisao').length;
                const os_analise = atendimentos.filter(a => a.status === 'em_analise').length; // if exists
                const os_finalizadas_mes = atendimentos.filter(a => {
                    if (a.status !== 'aprovada') return false;
                    const date = new Date(a.data);
                    return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
                }).length;
                const clientes = empresas.length;
                const atendimentos_mes = atendimentos.filter(a => {
                    const date = new Date(a.data);
                    return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
                }).length;

                // Collect activities from all companies
                let allActivities = [];
                empresas.forEach(empresa => {
                    if (empresa.historico_atividades) {
                        empresa.historico_atividades.forEach(activity => {
                            allActivities.push({
                                descricao: activity.descricao || activity.texto,
                                data: activity.data
                            });
                        });
                    }
                });

                // Sort by date desc and take last 10
                allActivities.sort((a, b) => new Date(b.data) - new Date(a.data));
                const atividades = allActivities.slice(0, 10);

                // Update metrics
                document.getElementById('os-abertas').textContent = os_abertas;
                document.getElementById('os-analise').textContent = os_analise;
                document.getElementById('os-finalizadas').textContent = os_finalizadas_mes;
                document.getElementById('total-clientes').textContent = clientes;

                // Update activities
                const lista = document.getElementById('lista-atividades');
                lista.innerHTML = '';

                if (atividades.length === 0) {
                    lista.innerHTML = '<li class="atividade-item">Nenhuma atividade recente</li>';
                } else {
                    atividades.forEach(atividade => {
                        const li = document.createElement('li');
                        li.className = 'atividade-item';
                        li.textContent = `${atividade.descricao} - ${new Date(atividade.data).toLocaleString()}`;
                        lista.appendChild(li);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar métricas:', error);
            }
        }
    </script>
    </script>
</body>
</html>
