<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus HUB - Suporte</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .container-principal {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .secao-apresentacao {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: var(--gradiente-esquerda);
        }

        .conteudo-apresentacao {
            max-width: 520px;
        }

        .logotipo {
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .subtitulo-topo {
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--verde-esmeralda);
            margin-bottom: 16px;
            font-weight: 600;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--branco);
        }

        h1 span {
            color: var(--verde-esmeralda);
        }

        .descricao-texto {
            color: var(--texto-secundario);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .citacao-rodape {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--texto-suave);
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 40px;
        }

        .secao-formulario {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: linear-gradient(135deg, #0f1b2f 0%, #1a3a4e 100%);
            overflow-y: auto;
        }

        .caixa-formulario {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--bordar);
            box-shadow: var(--sombra-lg);
        }

        .caixa-formulario h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitulo-formulario {
            color: var(--texto-secundario);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .bloco-campo {
            margin-bottom: 18px;
        }

        .bloco-campo label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--texto-principal);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .bloco-campo input,
        .bloco-campo textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface-strong);
            border: 1px solid var(--bordar);
            border-radius: 8px;
            color: var(--texto-principal);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 100px;
        }

        .bloco-campo input:focus,
        .bloco-campo textarea:focus {
            outline: none;
            border-color: var(--verde-esmeralda);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .bloco-campo input::placeholder,
        .bloco-campo textarea::placeholder {
            color: var(--texto-suave);
        }

        .opcoes-contato {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .opcoes-contato .bloco-campo {
            flex: 1;
            margin-bottom: 0;
        }

        .botao-acao {
            width: 100%;
            padding: 14px 24px;
            background: var(--verde-esmeralda);
            color: var(--azul-escuro);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .botao-acao:hover:not(:disabled) {
            background: var(--verde-escuro);
            transform: translateY(-2px);
            box-shadow: var(--sombra-md);
        }

        .botao-acao:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .area-voltar {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--texto-secundario);
            border-top: 1px solid var(--bordar);
            padding-top: 20px;
        }

        .area-voltar a {
            color: var(--destaque);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .area-voltar a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .alerta {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alerta.erro {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--erro);
            color: var(--erro);
        }

        .alerta.sucesso {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--verde-esmeralda);
            color: var(--verde-esmeralda);
        }

        .alerta.info {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--info);
            color: var(--info);
        }

        @media (max-width: 768px) {
            .container-principal {
                flex-direction: column;
            }

            .secao-apresentacao {
                flex: auto;
                padding: 40px 24px;
            }

            .secao-formulario {
                flex: auto;
                padding: 24px;
            }

            h1 {
                font-size: 2rem;
            }

            .opcoes-contato {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container-principal">
        <div class="secao-apresentacao">
            <div class="conteudo-apresentacao">
                <div class="logotipo"><img src="../assets/images/icon-sistem.png" alt="Nexus HUB" class="logo-icon"> Nexus HUB</div>
                <p class="subtitulo-topo">Central de Suporte</p>
                <h1>Precisando de <span>Ajuda</span>?</h1>
                <p class="descricao-texto">Nossa equipe de suporte está aqui para ajudá-lo. Preencha o formulário abaixo e em breve entraremos em contato com você.</p>
                <div class="citacao-rodape">
                    <i class="bi bi-quote"></i> Sua satisfação é nossa prioridade.
                </div>
            </div>
        </div>

        <div class="secao-formulario">
            <div class="caixa-formulario">
                <h2><i class="bi bi-headset"></i> Formulário de Suporte</h2>
                <p class="subtitulo-formulario">Envie-nos uma mensagem e responderemos em breve.</p>
                
                <div id="mensagemAlerta"></div>

                <form id="formSuporte">
                    <div class="bloco-campo">
                        <label for="nome"><i class="bi bi-person"></i> Nome Completo</label>
                        <input type="text" id="nome" placeholder="Seu nome" required>
                    </div>

                    <div class="opcoes-contato">
                        <div class="bloco-campo">
                            <label for="email"><i class="bi bi-envelope"></i> E-mail</label>
                            <input type="email" id="email" placeholder="seu@email.com">
                        </div>

                        <div class="bloco-campo">
                            <label for="telefone"><i class="bi bi-telephone"></i> Telefone</label>
                            <input type="tel" id="telefone" placeholder="(11) 98765-4321">
                        </div>
                    </div>

                    <div class="bloco-campo">
                        <label for="assunto"><i class="bi bi-chat-dots"></i> Assunto</label>
                        <input type="text" id="assunto" placeholder="Qual é sua dúvida?" required>
                    </div>

                    <div class="bloco-campo">
                        <label for="mensagem"><i class="bi bi-file-earmark-text"></i> Mensagem</label>
                        <textarea id="mensagem" placeholder="Descreva seu problema ou dúvida em detalhes..." required></textarea>
                    </div>

                    <button type="submit" class="botao-acao"><i class="bi bi-send"></i> Enviar Mensagem</button>
                </form>

                <div class="area-voltar">
                    <a href="../index.html"><i class="bi bi-arrow-left"></i> Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const formSuporte = document.getElementById('formSuporte');
        const mensagemAlerta = document.getElementById('mensagemAlerta');
        const botaoSubmit = formSuporte.querySelector('button[type="submit"]');

        formSuporte.addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const assunto = document.getElementById('assunto').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            // Validações
            if (!nome || !assunto || !mensagem) {
                mostrarAlerta('Por favor, preencha todos os campos obrigatórios.', 'erro');
                return;
            }

            if (!email && !telefone) {
                mostrarAlerta('Por favor, forneça pelo menos um meio de contato (e-mail ou telefone).', 'erro');
                return;
            }

            if (email && !validarEmail(email)) {
                mostrarAlerta('Por favor, insira um e-mail válido.', 'erro');
                return;
            }

            // Desabilitar botão durante envio
            botaoSubmit.disabled = true;
            botaoSubmit.textContent = 'Enviando...';

            try {
                // Enviar dados para o servidor PHP
                const resposta = await fetch('../php/enviar_suporte.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        nome: nome,
                        email: email,
                        telefone: telefone,
                        assunto: assunto,
                        mensagem: mensagem
                    })
                });

                const resultado = await resposta.json();

                if (resultado.sucesso) {
                    mostrarAlerta('Mensagem enviada com sucesso! Você será redirecionado em 3 segundos.', 'sucesso');
                    
                    // Limpar formulário
                    formSuporte.reset();

                    // Redirecionar após 3 segundos
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 3000);
                } else {
                    mostrarAlerta(resultado.mensagem || 'Erro ao enviar mensagem. Tente novamente.', 'erro');
                    botaoSubmit.disabled = false;
                    botaoSubmit.innerHTML = '<i class="bi bi-send"></i> Enviar Mensagem';
                }
            } catch (erro) {
                console.error('Erro:', erro);
                mostrarAlerta('Erro ao conectar ao servidor. Tente novamente.', 'erro');
                botaoSubmit.disabled = false;
                botaoSubmit.innerHTML = '<i class="bi bi-send"></i> Enviar Mensagem';
            }
        });

        function mostrarAlerta(mensagem, tipo) {
            mensagemAlerta.innerHTML = `<div class="alerta ${tipo}"><i class="bi bi-${tipo === 'erro' ? 'exclamation-triangle' : tipo === 'sucesso' ? 'check-circle' : 'info-circle'}"></i> ${mensagem}</div>`;
        }

        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
    </script>
</body>
</html>
