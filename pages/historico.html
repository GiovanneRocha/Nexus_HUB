<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico e Editor Multipáginas - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Estilos do Editor Multipáginas */
        .modal-editor {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            overflow-y: auto;
            padding: 40px 0;
        }
        .painel-editor {
            width: 850px; margin: auto; display: flex; flex-direction: column; gap: 30px;
        }
        .controles-superiores {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a3a 100%); 
            padding: 20px; 
            border-radius: 15px;
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 2001;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            border-left: 4px solid #4f46e5;
        }
        .folha-pdf {
            background: white; 
            width: 794px; 
            min-height: 1123px; 
            padding: 60px;
            margin: auto; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #333; 
            position: relative; 
            box-sizing: border-box;
            border-left: 8px solid #4f46e5;
        }
        .folha-pdf::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, transparent 100%);
            border-radius: 0 0 0 100%;
        }
        [contenteditable="true"] {
            border: 1px dashed transparent; 
            transition: 0.3s; 
            padding: 2px;
        }
        [contenteditable="true"]:hover {
            border: 1px dashed #4f46e5; 
            background: #f0f4ff;
        }
        .tabela-pdf { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px;
        }
        .tabela-pdf th { 
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); 
            color: white;
            padding: 12px; 
            border: 1px solid #4f46e5; 
            text-align: left; 
            font-size: 12px; 
            font-weight: 600;
        }
        .tabela-pdf td { 
            padding: 12px; 
            border: 1px solid #e0e0e0; 
            font-size: 14px; 
        }
        .tabela-pdf tbody tr:nth-child(odd) {
            background-color: #f9f9fd;
        }
        .rodape-pdf { 
            position: absolute; 
            bottom: 60px; 
            left: 60px; 
            width: calc(100% - 120px); 
            border-top: 2px solid #4f46e5; 
            padding-top: 20px; 
            font-size: 12px; 
            color: #4f46e5;
            font-weight: 600;
        }
    </style>
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">
            <!-- Header will be inserted here via JavaScript -->

            <section class="titulo-pagina-stack">
                <h1><i class="bi bi-clock-history"></i> Histórico de OS</h1>
                <p>Visualize e edite as páginas do relatório antes de exportar.</p>
            </section>

            <div class="card-tabela">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>CLIENTE</th>
                            <th>FROTA</th>
                            <th>AÇÃO</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-historico-corpo"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalEditor" class="modal-editor">
        <div class="painel-editor">
            <div class="controles-superiores">
                <div>
                    <h3 style="margin: 0;">Editor de Relatório</h3>
                    <span style="font-size: 0.8rem; color: #2ecc71;">● Modo Visualização Ativo</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="salvarEGerarPDF()" class="botao-acao" style="background: #2ecc71; padding: 10px 25px;"><i class="bi bi-download"></i> Baixar PDF Final</button>
                    <button onclick="fecharEditor()" class="botao-secundario" style="background: #444; color: white; border: none; padding: 10px 20px;"><i class="bi bi-x"></i> Sair</button>
                </div>
            </div>

            <div id="paginas-container">
                </div>
        </div>
    </div>

    <script>
        let osSelecionada = null;

        function renderizarTabela() {
            const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
            const finalizadas = atendimentos.filter(a => a.status === 'finalizada');
            const corpo = document.getElementById('tabela-historico-corpo');
            
            corpo.innerHTML = finalizadas.reverse().map(os => {
                let dataExibicao = '---';
                if (os.dataRegistro) {
                    dataExibicao = os.dataRegistro;
                } else if (os.data) {
                    try {
                        dataExibicao = new Date(os.data).toLocaleDateString('pt-BR');
                    } catch (e) {
                        dataExibicao = '---';
                    }
                }
                return `
                <tr>
                    <td>${dataExibicao}</td>
                    <td><strong>${os.cliente}</strong></td>
                    <td>${os.frota ? os.frota.length : 1} veículo(s)</td>
                    <td>
                        <button onclick="abrirEditor(${os.id})" class="botao-pequeno btn-pequeno-acoes">Visualizar Relatório</button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        const CONFIG_SERVICOS_HIST = {
            "Manutencao_Preventiva": "Manutenção Preventiva",
            "Troca_Oleo": "Troca de Óleo",
            "Suspensao": "Suspensão",
            "Freios": "Freios",
            "Eletrica": "Elétrica"
        };

        function resolverNomeServico(tipo) {
            if (!tipo) return '-';
            if (tipo.startsWith('predefinido_')) {
                const key = tipo.replace('predefinido_', '');
                return CONFIG_SERVICOS_HIST[key] || key.replace(/_/g, ' ');
            }
            if (tipo.startsWith('customizado_')) {
                const index = parseInt(tipo.replace('customizado_', ''));
                const custom = JSON.parse(localStorage.getItem('nexus_servicos_custom')) || [];
                return custom[index] ? custom[index].nome : tipo.replace(/_/g, ' ');
            }
            return tipo.replace(/_/g, ' ');
        }

                function abrirEditor(id) {
            const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
            const empresas = JSON.parse(localStorage.getItem('nexus_empresas')) || [];
            osSelecionada = atendimentos.find(a => a.id == id);
            const cliente = empresas.find(e => e.nome === osSelecionada.cliente) || {};
            
            const container = document.getElementById('paginas-container');
            container.innerHTML = ''; // Limpa anterior

            // --- CRIAÇÃO DA PÁGINA 1: CAPA/RESUMO ---
            const capa = document.createElement('div');
            capa.className = 'folha-pdf';
            capa.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #4f46e5; padding-bottom: 20px; margin-bottom: 30px;">
                    <div>
                        <h2 style="margin: 0; color: #4f46e5; font-size: 28px;">Nexus HUB</h2>
                        <p style="margin: 5px 0 0 0; color: #888; font-size: 12px;">Sistema de Gestão de Ordens de Serviço</p>
                    </div>
                    <div style="text-align: right;">
                        <p style="font-weight: 600; margin: 0; color: #4f46e5;">OS #${osSelecionada.id.toString().slice(-6)}</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.9rem; color: #666;">Data: ${osSelecionada.dataRegistro}</p>
                    </div>
                </div>
                <div style="background: linear-gradient(135deg, #f0f4ff 0%, #e8edff 100%); padding: 30px; border-radius: 10px; border-left: 4px solid #4f46e5; margin: 30px 0;">
                    <h1 style="font-size: 32px; margin: 0 0 15px 0; color: #1a1a1a;" contenteditable="true">Relatório de Serviços Corporativos</h1>
                    <p style="margin: 0; color: #4f46e5; font-weight: 600;">Detalhamento Técnico e Financeiro</p>
                </div>
                <div style="margin: 30px 0;">
                    <h3 style="color: #4f46e5; border-bottom: 2px solid #4f46e5; padding-bottom: 10px; margin-bottom: 15px;">Informações do Cliente</h3>
                    <p style="margin: 8px 0;"><strong>Empresa:</strong> ${osSelecionada.cliente}</p>
                    <p style="margin: 8px 0;"><strong>Contato:</strong> <span contenteditable="true">${cliente.contato || '---'}</span></p>
                    <p style="margin: 8px 0;"><strong>Email:</strong> <span contenteditable="true">${cliente.email || '---'}</span></p>
                    <p style="margin: 8px 0;"><strong>Telefone:</strong> <span contenteditable="true">${cliente.telefone || '---'}</span></p>
                </div>
                <div style="margin: 40px 0;">
                    <h3 style="color: #4f46e5; border-bottom: 2px solid #4f46e5; padding-bottom: 10px; margin-bottom: 15px;">Resumo Executivo</h3>
                    <p contenteditable="true" style="text-align: justify; line-height: 1.8; color: #555; margin: 0;">
                        Apresentamos o detalhamento técnico completo dos serviços realizados na frota corporativa de ${osSelecionada.cliente}. Este documento consolida todas as intervenções de manutenção executadas pela equipe técnica especializada da Nexus HUB, incluindo diagnósticos, substituições de componentes e análises de desempenho.
                    </p>
                </div>
                <div style="margin: 40px 0; background: #f9f9fd; padding: 20px; border-radius: 8px; border-left: 4px solid #4f46e5;">
                    <h4 style="margin: 0 0 15px 0; color: #4f46e5;">Resumo Financeiro</h4>
                    <table class="tabela-pdf">
                        <thead><tr><th>Caminhão / Veículo</th><th style="text-align: center;">Placa</th><th style="text-align: right;">Subtotal</th></tr></thead>
                        <tbody>
                            ${osSelecionada.frota.map(v => {
                                const totalV = v.servicos.reduce((acc, s) => acc + parseFloat(s.valor), 0);
                                return `<tr><td>${v.dadosVeiculo.modelo}</td><td style="text-align: center;">${v.dadosVeiculo.placa}</td><td style="text-align: right; font-weight: bold;">R$ ${totalV.toFixed(2)}</td></tr>`;
                            }).join('')}
                            <tr style="background: linear-gradient(135deg, #f0f4ff 0%, #e8edff 100%); font-size: 16px;">
                                <td colspan="2"><strong>Total Consolidado</strong></td>
                                <td style="text-align: right; color: #4f46e5;"><strong>R$ ${parseFloat(osSelecionada.valorTotalOS).toFixed(2)}</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="rodape-pdf">Relatório Gerado por Nexus HUB | Julian Vane - Administrador | ${new Date().toLocaleDateString('pt-BR')}</div>
            `;
            container.appendChild(capa);

            // --- CRIAÇÃO DAS PÁGINAS DE CADA VEÍCULO ---
            osSelecionada.frota.forEach(veiculo => {
                const pagV = document.createElement('div');
                pagV.className = 'folha-pdf';
                const totalV = veiculo.servicos.reduce((acc, s) => acc + parseFloat(s.valor), 0);
                
                pagV.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4f46e5; padding-bottom: 15px; margin-bottom: 25px;">
                        <h3 style="margin: 0; color: #4f46e5; font-size: 18px;">Nexus HUB - Detalhamento por Unidade</h3>
                        <span style="font-size: 0.85rem; color: #888; background: #f0f4ff; padding: 5px 12px; border-radius: 20px; border: 1px solid #4f46e5;">Veículo Específico</span>
                    </div>
                    <div style="margin: 30px 0; background: linear-gradient(135deg, #f0f4ff 0%, #e8edff 100%); padding: 20px; border-radius: 10px; border-left: 4px solid #4f46e5;">
                        <h2 style="margin: 0; color: #1a1a1a;">${veiculo.dadosVeiculo.modelo}</h2>
                        <p style="margin: 10px 0 0 0; color: #4f46e5; font-weight: 600; font-size: 14px;">
                            PLACA: <strong>${veiculo.dadosVeiculo.placa}</strong> | COR: <strong>${veiculo.dadosVeiculo.cor}</strong> | ANO: <strong>${veiculo.dadosVeiculo.ano}</strong>
                        </p>
                    </div>
                    <div style="margin: 30px 0;">
                        <h3 style="color: #4f46e5; border-bottom: 2px solid #4f46e5; padding-bottom: 10px; margin-bottom: 15px;">Serviços Executados</h3>
                        <table class="tabela-pdf">
                            <thead><tr><th>Serviço</th><th>Descrição Técnica</th><th style="text-align: right;">Valor</th></tr></thead>
                            <tbody>
                                ${veiculo.servicos.map(s => `
                                    <tr>
                                        <td><strong>${resolverNomeServico(s.tipo)}</strong></td>
                                        <td contenteditable="true" style="color: #666; font-size: 13px;">${s.descricao}</td>
                                        <td style="text-align: right; font-weight: 600;">R$ ${parseFloat(s.valor).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                                <tr style="background: linear-gradient(135deg, #f0f4ff 0%, #e8edff 100%); font-size: 14px;">
                                    <td colspan="2" style="text-align: right;"><strong>Subtotal do Veículo</strong></td>
                                    <td style="text-align: right; font-weight: bold; color: #4f46e5;">R$ ${totalV.toFixed(2)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top: 30px; padding: 20px; background: #f9f9fd; border-radius: 8px; border-left: 4px solid #4f46e5;">
                        <h4 style="margin: 0 0 10px 0; color: #4f46e5;">Observações Técnicas</h4>
                        <div contenteditable="true" style="min-height: 100px; border: none; padding: 0; font-size: 13px; color: #666; line-height: 1.6;">
                            Veículo foi submetido a inspeção completa. Todas as manutenções preventivas foram executadas conforme cronograma. Sistema em perfeitas condições de operação. Recomenda-se próxima revisão em 90 dias.
                        </div>
                    </div>
                    <div class="rodape-pdf">OS #${osSelecionada.id.toString().slice(-6)} | Veículo: ${veiculo.dadosVeiculo.placa} | ${new Date().toLocaleDateString('pt-BR')}</div>
                `;
                container.appendChild(pagV);
            });

            document.getElementById('modalEditor').style.display = 'block';
        }

        async function salvarEGerarPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'pt', 'a4');
            const folhas = document.querySelectorAll('.folha-pdf');
            
            // Oculta as bordas de edição para a captura
            document.querySelectorAll('[contenteditable="true"]').forEach(el => el.style.border = 'none');

            for (let i = 0; i < folhas.length; i++) {
                const canvas = await html2canvas(folhas[i], { scale: 2 });
                const imgData = canvas.toDataURL('image/png');
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, 0, 595.28, 841.89);
            }

            pdf.save(`Relatorio_Nexus_${osSelecionada.cliente}.pdf`);
            fecharEditor();
        }

        function fecharEditor() { document.getElementById('modalEditor').style.display = 'none'; }
        window.onload = renderizarTabela;
    </script>
    <script src="../assets/js/common.js"></script>
    <script>
        // Insert sidebar and header from common.js
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('historico'));
            document.querySelector('main').insertAdjacentHTML('afterbegin', getHeaderHTML());
        });
    </script>
</body>
</html>
