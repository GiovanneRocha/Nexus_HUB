<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Serviços - Nexus HUB</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-principal">
        <div class="secao-formulario">
            <div class="caixa-formulario">
                <h2><i class="bi bi-tools"></i> Cadastro de Serviços</h2>
                <form id="formServico">
                    <div class="bloco-campo">
                        <label for="nomeServico"><i class="bi bi-gear"></i> Nome do Serviço</label>
                        <input type="text" id="nomeServico" placeholder="Ex: Troca de óleo" required>
                    </div>
                    <button type="submit" class="botao-acao"><i class="bi bi-plus-circle"></i> Adicionar Serviço</button>
                </form>
                <div id="mensagem" class="mensagem-sucesso" style="display:none;"></div>
                <hr>
                <h3>Serviços Cadastrados</h3>
                <input type="text" id="buscaServico" placeholder="Buscar por nome do serviço..." style="width:100%;margin-bottom:10px;">
                <ul id="listaServicos" class="lista-servicos"></ul>
            </div>
        </div>
    </div>
    <script>
        function carregarServicos(filtro = "") {
            const lista = document.getElementById('listaServicos');
            lista.innerHTML = '';
            const servicos = JSON.parse(localStorage.getItem('servicos')) || [];
            const filtroLower = filtro.trim().toLowerCase();
            servicos.filter(servico => {
                if (!filtroLower) return true;
                return servico.nome.toLowerCase().includes(filtroLower);
            }).forEach((servico, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="nome-servico">${servico.nome}</span>
                    <button onclick="editarServico(${idx})" title="Editar"><i class="bi bi-pencil"></i></button>
                    <button onclick="excluirServico(${idx})" title="Excluir"><i class="bi bi-trash"></i></button>
                `;
                lista.appendChild(li);
            });
        }
        // Filtro de busca
        document.addEventListener('DOMContentLoaded', function() {
            const busca = document.getElementById('buscaServico');
            if (busca) {
                busca.addEventListener('input', function() {
                    carregarServicos(this.value);
                });
            }
            carregarServicos();
        });

        function mostrarMensagem(msg, tipo) {
            const el = document.getElementById('mensagem');
            el.textContent = msg;
            el.className = tipo === 'erro' ? 'mensagem-erro' : 'mensagem-sucesso';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3500);
        }

        document.getElementById('formServico').addEventListener('submit', function(evento) {
            evento.preventDefault();
            const nomeInput = document.getElementById('nomeServico');
            const nome = nomeInput.value.trim();
            nomeInput.classList.remove('erro-campo');
            if (!nome) {
                mostrarMensagem('Informe o nome do serviço!', 'erro');
                nomeInput.classList.add('erro-campo');
                return;
            }
            let servicos = JSON.parse(localStorage.getItem('servicos')) || [];
            if (window.idxEdicao !== undefined) {
                servicos[window.idxEdicao].nome = nome;
                window.idxEdicao = undefined;
                mostrarMensagem('Serviço editado com sucesso!', 'sucesso');
            } else {
                servicos.push({ nome });
                mostrarMensagem('Serviço cadastrado com sucesso!', 'sucesso');
            }
            localStorage.setItem('servicos', JSON.stringify(servicos));
            document.getElementById('formServico').reset();
            carregarServicos();
        });

        window.editarServico = function(idx) {
            const servicos = JSON.parse(localStorage.getItem('servicos')) || [];
            document.getElementById('nomeServico').value = servicos[idx].nome;
            window.idxEdicao = idx;
        };

        window.excluirServico = function(idx) {
            if (!confirm('Deseja realmente excluir este serviço?')) return;
            let servicos = JSON.parse(localStorage.getItem('servicos')) || [];
            servicos.splice(idx, 1);
            localStorage.setItem('servicos', JSON.stringify(servicos));
            carregarServicos();
        };

        carregarServicos();

        // Estilo para campos com erro
        const style = document.createElement('style');
        style.innerHTML = `
        .erro-campo { border: 2px solid #e74c3c !important; background: #fff0f0 !important; }
        .mensagem-erro { color: #fff; background: #e74c3c; padding: 8px; border-radius: 4px; margin-top: 10px; text-align: center; }
        .mensagem-sucesso { color: #fff; background: #10b981; padding: 8px; border-radius: 4px; margin-top: 10px; text-align: center; }
        .lista-servicos { list-style: none; padding: 0; }
        .lista-servicos li { background: #1f2937; color: #fff; margin-bottom: 6px; padding: 8px 12px; border-radius: 4px; font-size: 1rem; }
        @media (max-width: 600px) {
            .caixa-formulario, .secao-formulario { padding: 8px !important; }
            .lista-servicos li { font-size: 0.95rem; padding: 6px 6px; }
        }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
