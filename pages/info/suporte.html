<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus HUB - Suporte</title>
    <link
      rel="icon"
      type="image/png"
      href="../../assets/images/icon-sistem.png"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/pages.css" />
    <script src="../../assets/js/validacoes-cliente.js"></script>
    <script src="../../assets/js/pages.js"></script>
  </head>
  <body>
    <div class="container-principal">
      <div class="secao-apresentacao">
        <div class="conteudo-apresentacao">
          <div class="logotipo">
            <img
              src="../../assets/images/icon-sistem.png"
              alt="Nexus HUB"
              class="logo-icon"
            />
            Nexus HUB
          </div>
          <p class="subtitulo-topo">Central de Suporte</p>
          <h1>Precisando de <span>Ajuda</span>?</h1>
          <p class="descricao-texto">
            Nossa equipe de suporte está aqui para ajudá-lo. Preencha o
            formulário abaixo e em breve entraremos em contato com você.
          </p>
          <div class="citacao-rodape">
            <i class="bi bi-quote"></i> Sua satisfação é nossa prioridade.
          </div>
        </div>
      </div>

      <div class="secao-formulario">
        <div class="caixa-formulario">
          <h2><i class="bi bi-headset"></i> Formulário de Suporte</h2>
          <p class="subtitulo-formulario">
            Envie-nos uma mensagem e responderemos em breve.
          </p>

          <div id="mensagemAlerta"></div>

          <form id="formSuporte">
            <div class="bloco-campo">
              <label for="nome"
                ><i class="bi bi-person"></i> Nome Completo</label
              >
              <input type="text" id="nome" placeholder="Seu nome" maxlength="100" required />
            </div>

            <div class="opcoes-contato">
              <div class="bloco-campo">
                <label for="email"><i class="bi bi-envelope"></i> E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" maxlength="100" />
              </div>

              <div class="bloco-campo">
                <label for="telefone"
                  ><i class="bi bi-telephone"></i> Telefone</label
                >
                <input type="tel" id="telefone" placeholder="(11) 98765-4321" maxlength="15" inputmode="numeric" data-mascara="telefone" />
              </div>
            </div>

            <div class="bloco-campo">
              <label for="assunto"
                ><i class="bi bi-chat-dots"></i> Assunto</label
              >
              <input
                type="text"
                id="assunto"
                placeholder="Qual é sua dúvida?"
                maxlength="150"
                required
              />
            </div>

            <div class="bloco-campo">
              <label for="mensagem"
                ><i class="bi bi-file-earmark-text"></i> Mensagem</label
              >
              <textarea
                id="mensagem"
                placeholder="Descreva seu problema ou dúvida em detalhes..."
                maxlength="2000"
                required
              ></textarea>
            </div>

            <button type="submit" class="botao-acao">
              <i class="bi bi-send"></i> Enviar Mensagem
            </button>
          </form>

          <div class="area-voltar">
            <a href="../../index.html"
              ><i class="bi bi-arrow-left"></i> Voltar ao Login</a
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      const formSuporte = document.getElementById("formSuporte")
      const mensagemAlerta = document.getElementById("mensagemAlerta")
      const botaoSubmit = formSuporte.querySelector('button[type="submit"]')

      formSuporte.addEventListener("submit", async function (e) {
        e.preventDefault()

        const nome = document.getElementById("nome").value.trim()
        const email = document.getElementById("email").value.trim()
        const telefone = document.getElementById("telefone").value.trim()
        const assunto = document.getElementById("assunto").value.trim()
        const mensagem = document.getElementById("mensagem").value.trim()

        // Validações
        if (nome.length < 3 || !nome.trim()) {
          mostrarAlerta(
            "Informe seu nome completo (mínimo 3 caracteres).",
            "erro",
          )
          return
        }

        if (!assunto || assunto.length < 3) {
          mostrarAlerta("Informe o assunto (mínimo 3 caracteres).", "erro")
          return
        }

        if (!mensagem || mensagem.length < 10) {
          mostrarAlerta(
            "Descreva sua dúvida com mais detalhes (mínimo 10 caracteres).",
            "erro",
          )
          return
        }

        if (!email && !telefone) {
          mostrarAlerta(
            "Por favor, forneça pelo menos um meio de contato (e-mail ou telefone).",
            "erro",
          )
          return
        }

        if (email && !validarEmail(email)) {
          mostrarAlerta("Por favor, insira um e-mail válido.", "erro")
          return
        }

        if (telefone && !validarTelefone(telefone)) {
          mostrarAlerta(
            "Telefone inválido. Informe DDD + número, ex: (11) 98765-4321.",
            "erro",
          )
          return
        }

        // Desabilitar botão durante envio
        botaoSubmit.disabled = true
        botaoSubmit.textContent = "Enviando..."

        try {
          // Enviar dados para o servidor PHP
          const resposta = await fetch("../php/enviar_suporte.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              nome: nome,
              email: email,
              telefone: telefone,
              assunto: assunto,
              mensagem: mensagem,
            }),
          })

          const resultado = await resposta.json()

          if (resultado.sucesso) {
            mostrarAlerta(
              "Mensagem enviada com sucesso! Você será redirecionado em 3 segundos.",
              "sucesso",
            )

            // Limpar formulário
            formSuporte.reset()

            // Redirecionar após 3 segundos
            setTimeout(() => {
              window.location.href = "../index.html"
            }, 3000)
          } else {
            mostrarAlerta(
              resultado.mensagem || "Erro ao enviar mensagem. Tente novamente.",
              "erro",
            )
            botaoSubmit.disabled = false
            botaoSubmit.innerHTML = '<i class="bi bi-send"></i> Enviar Mensagem'
          }
        } catch (erro) {
          console.error("Erro:", erro)
          mostrarAlerta(
            "Erro ao conectar ao servidor. Tente novamente.",
            "erro",
          )
          botaoSubmit.disabled = false
          botaoSubmit.innerHTML = '<i class="bi bi-send"></i> Enviar Mensagem'
        }
      })

      function mostrarAlerta(mensagem, tipo) {
        mensagemAlerta.innerHTML = `<div class="alerta ${tipo}"><i class="bi bi-${tipo === "erro" ? "exclamation-triangle" : tipo === "sucesso" ? "check-circle" : "info-circle"}"></i> ${mensagem}</div>`
      }

      function validarEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        return regex.test(email)
      }

      function validarTelefone(telefone) {
        const numeros = telefone.replace(/\D/g, "")
        return numeros.length === 10 || numeros.length === 11
      }
    </script>
  </body>
</html>
