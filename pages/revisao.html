<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de OS - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* Estilos para o Modal de Verificação */
        .modal-revisao {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }
        .modal-conteudo {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 25px;
            width: 70%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .bloco-detalhe-veiculo {
            background: #f8f9fd;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #4f46e5;
        }
        .tabela-mini-servicos {
            width: 100%;
            margin-top: 10px;
            font-size: 0.85rem;
            border-collapse: collapse;
        }
        .tabela-mini-servicos th { color: #777; padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        .tabela-mini-servicos td { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">
            <!-- Header will be inserted here via JavaScript -->

            <section class="titulo-pagina">
                <h1><i class="bi bi-check-square"></i> Ordens de Serviço em Revisão</h1>
                <p>Clique em "Ver Detalhes" para conferir os itens de cada veículo antes de aprovar.</p>
            </section>

            <div class="card-tabela">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>CLIENTE</th>
                            <th>FROTA</th>
                            <th>TOTAL</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-revisao-corpo"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalVerificacao" class="modal-revisao">
        <div class="modal-conteudo">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 style="color: var(--azul-escuro);">Verificação Final da OS</h2>
                <button onclick="fecharModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            
            <div id="detalhes-os-modal">
                </div>

            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button id="btnAprovarModal" class="botao-acao" style="background: #2ecc71; flex: 1; padding: 20px;"><i class="bi bi-check-circle"></i> Aprovar e Finalizar</button>
                <button onclick="fecharModal()" class="botao-secundario" style="flex: 1; padding: 20px; border: 1px solid #ddd;"><i class="bi bi-arrow-left"></i> Voltar</button>
            </div>
        </div>
    </div>

    <script>
        function renderizarRevisao() {
            const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
            const emRevisao = atendimentos.filter(a => a.status === 'pendente_revisao');
            const corpo = document.getElementById('tabela-revisao-corpo');

            if (emRevisao.length === 0) {
                corpo.innerHTML = `<tr><td colspan="5" class="sem-dados">Nenhuma OS pendente.</td></tr>`;
                return;
            }

            corpo.innerHTML = emRevisao.map(os => `
                <tr>
                    <td>${os.dataRegistro || 'Recém criada'}</td>
                    <td><strong>${os.cliente}</strong></td>
                    <td>${os.frota ? os.frota.length : 1} Veículo(s)</td>
                    <td><strong style="color: var(--verde-agua);">R$ ${parseFloat(os.valorTotalOS || 0).toFixed(2)}</strong></td>
                    <td>
                        <button onclick="abrirVerificacao(${os.id})" class="botao-pequeno btn-pequeno-acoes"><i class="bi bi-search"></i> Ver Detalhes</button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirVerificacao(id) {
            const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
            const os = atendimentos.find(a => a.id == id);
            const container = document.getElementById('detalhes-os-modal');
            
            let htmlVeiculos = os.frota.map((item, index) => `
                <div class="bloco-detalhe-veiculo">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <strong>Veículo ${index + 1}: ${item.dadosVeiculo.modelo}</strong>
                        <span style="color: #4f46e5; font-weight: bold;">PLACA: ${item.dadosVeiculo.placa}</span>
                    </div>
                    <table class="tabela-mini-servicos">
                        <thead>
                            <tr><th>Serviço</th><th>Descrição</th><th>Valor</th></tr>
                        </thead>
                        <tbody>
                            ${item.servicos.map(s => `
                                <tr>
                                    <td>${s.tipo.replace('_', ' ')}</td>
                                    <td style="color: #666;">${s.descricao}</td>
                                    <td style="font-weight: bold;">R$ ${parseFloat(s.valor).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `).join('');

            container.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <p><strong>Cliente:</strong> ${os.cliente}</p>
                    <p><strong>Total da OS:</strong> <span style="color: var(--verde-agua); font-weight: 800;">R$ ${parseFloat(os.valorTotalOS).toFixed(2)}</span></p>
                </div>
                ${htmlVeiculos}
            `;

            document.getElementById('btnAprovarModal').onclick = () => aprovarOS(id);
            document.getElementById('modalVerificacao').style.display = 'block';
        }

        function fecharModal() { document.getElementById('modalVerificacao').style.display = 'none'; }

        function aprovarOS(id) {
            let atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
            const idx = atendimentos.findIndex(a => a.id == id);
            atendimentos[idx].status = 'finalizada';
            localStorage.setItem('atendimentos', JSON.stringify(atendimentos));
            alert("OS Aprovada e enviada para o Histórico!");
            fecharModal();
            renderizarRevisao();
        }

        window.onload = renderizarRevisao;
    </script>
    <script src="../assets/js/common.js"></script>
    <script>
        // Insert sidebar and header from common.js
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('revisao'));
            document.querySelector('main').insertAdjacentHTML('afterbegin', getHeaderHTML());
        });
    </script>
</body>
</html>
