<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículos - Nexus HUB</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-sistem.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/common.js"></script>
</head>
<body class="corpo-dashboard">
    <div class="layout-erp">
        <!-- Sidebar and Header will be inserted here via JavaScript -->

        <main class="conteudo-principal">
            <!-- Header will be inserted here via JavaScript -->

            <section class="titulo-pagina">
                <h1><i class="bi bi-tools"></i> Gestão de Veículos</h1>
                <p>Cadastre veículos para serem utilizados nas Ordens de Serviço.</p>
            </section>

            <div class="container-formulario-novo-atendimento">
                <form id="formCadastroVeiculo">
                    <div class="secao-formulario-novo">
                        <h3><i class="bi bi-plus-lg"></i> Novo Veículo</h3>
                        <div class="linha-campos">
                            <div class="bloco-campo-novo">
                                <label><i class="bi bi-building"></i> Selecionar Empresa</label>
                                <select id="selecao-empresa-veiculo" required>
                                    <option value="">Escolha uma empresa...</option>
                                </select>
                            </div>
                            <div class="bloco-campo-novo">
                                <label><i class="bi bi-tag"></i> Placa</label>
                                <input type="text" id="placa-veiculo" placeholder="ABC-1234" required>
                            </div>
                        </div>
                        <div class="linha-campos">
                            <div class="bloco-campo-novo">
                                <label><i class="bi bi-type"></i> Modelo</label>
                                <input type="text" id="modelo-veiculo" placeholder="Modelo do veículo" required>
                            </div>
                            <div class="bloco-campo-novo">
                                <label><i class="bi bi-calendar-event"></i> Ano</label>
                                <input type="number" id="ano-veiculo" placeholder="2024" required>
                            </div>
                        </div>
                        <div class="bloco-campo-novo">
                            <label><i class="bi bi-palette"></i> Cor</label>
                            <input type="text" id="cor-veiculo" placeholder="Branco" required>
                        </div>
                        <button type="submit" class="botao-acao" style="margin-top: 20px;">
                            <i class="bi bi-save"></i> Salvar Veículo
                        </button>
                    </div>
                </form>

                <div class="secao-formulario-novo">
                    <h3><i class="bi bi-list-ul"></i> Veículos Cadastrados</h3>
                    <div id="lista-veiculos-cadastrados">
                        </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('formCadastroVeiculo');

        function renderizarVeiculos() {
            const veiculos = JSON.parse(localStorage.getItem('nexus_veiculos')) || [];
            const container = document.getElementById('lista-veiculos-cadastrados');
            
            if (veiculos.length === 0) {
                container.innerHTML = '<p style="color: var(--texto-secundario);">Nenhum veículo cadastrado.</p>';
                return;
            }

            container.innerHTML = `
                <table class="tabela-custom" style="width: 100%; color: var(--texto-principal);">
                    <thead>
                        <tr style="text-align: left; border-bottom: 1px solid var(--bordar);">
                            <th>Empresa</th>
                            <th>Placa</th>
                            <th>Modelo</th>
                            <th>Ano</th>
                            <th>Cor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${veiculos.map((v, index) => `
                            <tr>
                                <td>${v.empresa}</td>
                                <td>${v.placa}</td>
                                <td>${v.modelo}</td>
                                <td>${v.ano}</td>
                                <td>${v.cor}</td>
                                <td><button onclick="removerVeiculo(${index})" class="botao-cancelar" style="padding: 5px 10px;"><i class="bi bi-trash"></i></button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const novo = {
                empresa: document.getElementById('selecao-empresa-veiculo').value,
                placa: document.getElementById('placa-veiculo').value,
                modelo: document.getElementById('modelo-veiculo').value,
                ano: document.getElementById('ano-veiculo').value,
                cor: document.getElementById('cor-veiculo').value
            };
            const veiculos = JSON.parse(localStorage.getItem('nexus_veiculos')) || [];
            veiculos.push(novo);
            localStorage.setItem('nexus_veiculos', JSON.stringify(veiculos));
            form.reset();
            renderizarVeiculos();
        });

        function removerVeiculo(index) {
            if(confirm("Deseja excluir este veículo?")) {
                const veiculos = JSON.parse(localStorage.getItem('nexus_veiculos'));
                veiculos.splice(index, 1);
                localStorage.setItem('nexus_veiculos', JSON.stringify(veiculos));
                renderizarVeiculos();
            }
        }

        function popularEmpresas() {
            const select = document.getElementById('selecao-empresa-veiculo');
            const empresas = JSON.parse(localStorage.getItem('nexus_empresas')) || [];
            empresas.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.nome;
                opt.textContent = emp.nome;
                select.appendChild(opt);
            });
        }

        window.onload = () => {
            popularEmpresas();
            renderizarVeiculos();
        };
    </script>
    <script>
        // Insert sidebar and header from common.js
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.layout-erp').insertAdjacentHTML('afterbegin', getSidebarHTML('cadastro_veiculo'));
            document.querySelector('main').insertAdjacentHTML('afterbegin', getHeaderHTML());
        });
    </script>
</body>
</html>
