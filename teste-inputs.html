<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Inputs - Fundo Claro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            padding: 40px;
            font-family: 'Inter', sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .secao {
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .secao h2 {
            margin-top: 0;
        }
        .campo {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Teste de Inputs com Fundo Claro</h1>
        
        <div class="secao">
            <h2>Inputs Padrão</h2>
            
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            
            <div class="campo">
                <label for="texto">Texto</label>
                <input type="text" id="texto" placeholder="Digite algo aqui">
            </div>
            
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>
            
            <div class="campo">
                <label for="numero">Número</label>
                <input type="number" id="numero" placeholder="Digite um número">
            </div>
            
            <div class="campo">
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>
        </div>
        
        <div class="secao">
            <h2>Select e Textarea</h2>
            
            <div class="campo">
                <label for="opcoes">Selecione uma opção</label>
                <select id="opcoes">
                    <option value="">-- Escolha uma opção --</option>
                    <option value="1">Opção 1</option>
                    <option value="2">Opção 2</option>
                    <option value="3">Opção 3</option>
                </select>
            </div>
            
            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem aqui..." rows="4"></textarea>
            </div>
        </div>
        
        <div class="secao">
            <h2>Filtros</h2>
            
            <div class="campo">
                <label for="filtro1" class="filtro-label">Filtro 1</label>
                <input type="text" id="filtro1" class="filtro-input" placeholder="Digite para filtrar...">
            </div>
            
            <div class="campo">
                <label for="filtro2">Filtro Select</label>
                <select id="filtro2" class="filtro-select">
                    <option value="">-- Todos --</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
        </div>
        
        <div style="margin-top: 40px; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 12px; border-left: 4px solid #10b981;">
            <h3>✅ Verificação Completa</h3>
            <p><strong>Todos os inputs agora têm:</strong></p>
            <ul>
                <li>✓ Fundo branco (#ffffff)</li>
                <li>✓ Texto escuro (#1f2937)</li>
                <li>✓ Bordas cinza claro (#d1d5db)</li>
                <li>✓ Melhor contraste e legibilidade</li>
                <li>✓ Funcionam em tema escuro e claro</li>
            </ul>
        </div>
    </div>
</body>
</html>
