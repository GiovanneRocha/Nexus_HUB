<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Inputs | Nexus HUB</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            padding: 40px;
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .secao {
            margin-bottom: 28px;
            padding: 22px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        }

        .secao h2 {
            margin-top: 0;
            margin-bottom: 18px;
            color: #0f172a;
            font-size: 1.2rem;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #1f2937;
            font-size: 0.85rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .status-verificacao {
            margin-top: 32px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: 12px;
            border-left: 4px solid #10b981;
        }

        .status-verificacao h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste de inputs do sistema</h1>

        <div class="secao">
            <h2>Inputs padrão</h2>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>

            <div class="campo">
                <label for="texto">Texto</label>
                <input type="text" id="texto" placeholder="Digite algo aqui">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>

            <div class="campo">
                <label for="numero">Número</label>
                <input type="number" id="numero" placeholder="Digite um número">
            </div>

            <div class="campo">
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>
        </div>

        <div class="secao">
            <h2>Select e textarea</h2>

            <div class="campo">
                <label for="opcoes">Selecione uma opção</label>
                <select id="opcoes">
                    <option value="">-- Escolha uma opção --</option>
                    <option value="1">Opção 1</option>
                    <option value="2">Opção 2</option>
                    <option value="3">Opção 3</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem aqui..." rows="4"></textarea>
            </div>
        </div>

        <div class="secao">
            <h2>Filtros</h2>

            <div class="campo">
                <label for="filtro1">Filtro 1</label>
                <input type="text" id="filtro1" placeholder="Digite para filtrar...">
            </div>

            <div class="campo">
                <label for="filtro2">Filtro Select</label>
                <select id="filtro2">
                    <option value="">Selecione</option>
                    <option value="recentes">Recentes</option>
                    <option value="antigos">Antigos</option>
                    <option value="pendentes">Pendentes</option>
                </select>
            </div>
        </div>

        <div class="status-verificacao">
            <h3>Verificação visual</h3>
            <p><strong>Todos os inputs apresentam:</strong></p>
            <ul>
                <li>fundo branco</li>
                <li>texto escuro</li>
                <li>borda clara</li>
                <li>melhor contraste e leitura</li>
                <li>padronização visual em toda a interface</li>
            </ul>
        </div>
    </div>
</body>
</html>
