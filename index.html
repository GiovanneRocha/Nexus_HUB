<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHUB - Login & Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <header>
            <img src="Images\atomo.png" alt="Logo" class="logo">
            <h1>Nexus</h1>
            <p>Faça Login na sua Conta!</p>
        </header>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="username" placeholder="Login" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Senha" required>
                <i class="fa-regular fa-eye" id="togglePassword"></i>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>

            <div class="form-footer">
                <a href="recuperar.html" class="link">Recuperar a senha?</a>
            </div>
        </form>

        <div class="signup-section">
            Não tem uma conta? <a href="signup.html">Sign up agora</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.querySelector('#togglePassword');
            const passwordField = document.querySelector('#password');
            const loginForm = document.querySelector('#loginForm');

            // Alternar visibilidade da senha
            togglePassword.addEventListener('click', function() {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // Lógica de submissão
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const user = document.querySelector('#username').value;
                alert("Login processado para: " + user);
            });
        });

    </script>

</body>
</html>
