<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Atheneum - Recuperação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-principal">
        <div class="secao-apresentacao fundo-recuperacao">
            <div class="conteudo-apresentacao">
                <div class="box-editorial">
                    <h1>Recuperação de Acesso</h1>
                    <p>Redefinir sua senha de forma segura e rápida.</p>
                </div>
            </div>
        </div>

        <div class="secao-formulario">
            <div class="botao-voltar">
                <a href="index.html">&larr; VOLTAR AO LOGIN</a>
            </div>
            
            <div class="caixa-formulario">
                <h2>Esqueceu a senha?</h2>
                <p class="subtitulo-formulario">Insira o e-mail da sua conta para receber as instruções.</p>
                
                <form id="formRecuperar">
                    <div class="bloco-campo">
                        <label>Email Corporativo</label>
                        <input type="email" placeholder="nome@suaorg.com.br" required>
                    </div>

                    <button type="submit" class="botao-acao">Enviar Instruções</button>
                </form>

                <div class="alerta-suporte">
                    <strong>Precisa de ajuda imediata?</strong>
                    <p>Nossa equipe está disponível para verificação de identidade manual.</p>
                </div>

                <div class="rodape-centralizado">
                    <div class="links-institucionais">
                        <a href="#">Sobre</a>
                        <a href="#">Contato</a>
                        <a href="#">Suporte</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
